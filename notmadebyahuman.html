<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>vectraa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;900&display=swap');
        
        body {
            margin: 0;
            overflow: hidden;
            background: #020202;
            font-family: 'Inter', sans-serif;
            touch-action: none;
            user-select: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .hud {
            position: absolute;
            top: 40px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #score-display {
            color: #fff;
            font-weight: 900;
            font-size: 24px;
        }

        #gate-status {
            color: #00ffcc;
            margin-top: 5px;
            font-weight: 600;
        }

        .menu-card {
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 4px;
            text-align: center;
            pointer-events: auto;
            max-width: 85%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .btn {
            background: #fff;
            color: #000;
            padding: 15px 40px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 20px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            display: inline-block;
        }

        .btn:active {
            transform: scale(0.95);
            background: #00ffcc;
        }

        .glitch-text {
            font-size: 48px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 10px;
            letter-spacing: -2px;
        }

        .toggle-container {
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: rgba(255,255,255,0.6);
            font-size: 11px;
            letter-spacing: 1px;
            cursor: pointer;
        }

        input[type="checkbox"] {
            accent-color: #00ffcc;
            width: 14px;
            height: 14px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <div class="hud">
            <div id="score-display">0</div>
            <div id="gate-status">GATE 1: CALIBRATION</div>
        </div>

        <div id="start-menu" class="menu-card">
            <h1 class="glitch-text">vectraa</h1>
            <p class="text-white/50 text-xs tracking-widest mb-6 uppercase">not ez</p>
            <button class="btn" onclick="startGame()">BEGIN</button>
            <label class="toggle-container">
                <input type="checkbox" id="hitbox-toggle-start" onchange="syncHitboxToggle(this)">
                <span>collision hitboxes (BLUE/RED)</span>
            </label>
        </div>

        <div id="death-menu" class="menu-card hidden">
            <h1 class="text-red-500 font-black text-4xl mb-2">FAILED</h1>
            <p id="final-score" class="text-white text-xl mb-2">0 POINTS</p>
            <p id="final-gate" class="text-white/40 text-xs uppercase tracking-tighter mb-6">REACHED GATE 1</p>
            <button class="btn" onclick="startGame()">RETRY</button>
            <label class="toggle-container">
                <input type="checkbox" id="hitbox-toggle-death" onchange="syncHitboxToggle(this)">
                <span>DEBUG HITBOXES</span>
            </label>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score-display');
        const gateStatusEl = document.getElementById('gate-status');
        const startMenu = document.getElementById('start-menu');
        const deathMenu = document.getElementById('death-menu');
        const finalScoreEl = document.getElementById('final-score');
        const finalGateEl = document.getElementById('final-gate');

        let width, height, dpr;
        let gameState = 'MENU';
        let score = 0;
        let currentGate = 1;
        let showHitboxes = false;

        // Re-calibrated Constants
        const PLAYER_RADIUS = 8; 
        const GATE_WIDTH = 75; 
        const GATE_HEIGHT = 8;
        const FRICTION = 0.88;
        const STEER_SENSITIVITY = 0.035; // Significant reduction for precision
        const HITBOX_LINGER_MS = 75;

        let player = {
            x: 0,
            y: 0,
            vx: 0,
            color: '#00ffcc',
            history: []
        };

        let isDragging = false;
        let startTouchX = 0;
        let currentTouchX = 0;

        let obstacles = [];
        let speed = 5;
        let frame = 0;

        function resize() {
            dpr = window.devicePixelRatio || 1;
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            player.x = width / 2;
            player.y = height * 0.85;
        }

        window.addEventListener('resize', resize);
        resize();

        function syncHitboxToggle(el) {
            showHitboxes = el.checked;
            document.getElementById('hitbox-toggle-start').checked = showHitboxes;
            document.getElementById('hitbox-toggle-death').checked = showHitboxes;
        }

        // Input Logic
        function handleStart(x) { isDragging = true; startTouchX = x; currentTouchX = x; }
        function handleMove(x) { if (isDragging) currentTouchX = x; }
        function handleEnd() { isDragging = false; }

        window.addEventListener('mousedown', e => handleStart(e.clientX));
        window.addEventListener('mousemove', e => handleMove(e.clientX));
        window.addEventListener('mouseup', handleEnd);
        window.addEventListener('touchstart', e => handleStart(e.touches[0].clientX), {passive: false});
        window.addEventListener('touchmove', e => { e.preventDefault(); handleMove(e.touches[0].clientX); }, {passive: false});
        window.addEventListener('touchend', handleEnd);

        function updateGateSystem() {
            if (score < 10) {
                currentGate = 1;
                gateStatusEl.innerText = "GATE 1: CALIBRATION";
                speed = 6;
            } else if (score < 25) {
                currentGate = 2;
                gateStatusEl.innerText = "GATE 2: INTERCEPTION";
                speed = 7.5;
            } else if (score < 50) {
                currentGate = 3;
                gateStatusEl.innerText = "GATE 3: OVERDRIVE";
                speed = 9.5;
            } else {
                currentGate = 4;
                gateStatusEl.innerText = "GATE 4: ANNIHILATION";
                speed = 11;
            }
        }

        function createObstacle() {
            let type = 'gate';
            
            if (currentGate === 1) {
                type = 'gate';
            } else if (currentGate === 2) {
                type = Math.random() > 0.85 ? 'interceptor' : 'gate';
            } else if (currentGate === 3) {
                type = Math.random() > 0.6 ? 'interceptor' : 'gate';
            } else if (currentGate === 4) {
                // Undertale boss style: high speed, mixed projectiles
                type = Math.random() > 0.4 ? 'interceptor' : 'gate';
            }

            if (type === 'interceptor') {
                const isDiagonal = currentGate >= 3 && Math.random() > 0.5;
                obstacles.push({
                    type: 'interceptor',
                    x: Math.random() * (width - 30),
                    y: -50,
                    w: 30,
                    h: 30,
                    vx: isDiagonal ? (Math.random() - 0.5) * 6 : 0,
                    speedMult: currentGate === 4 ? 1.8 : 1.4,
                    color: '#ff3300'
                });
            } else {
                const gapX = Math.random() * (width - GATE_WIDTH - 40) + 20;
                obstacles.push({
                    type: 'gate',
                    y: -50,
                    gapX: gapX,
                    passed: false,
                    speedMult: 1
                });
            }
        }

        function startGame() {
            score = 0;
            currentGate = 1;
            obstacles = [];
            player.vx = 0;
            player.x = width / 2;
            player.history = [];
            gameState = 'PLAYING';
            startMenu.classList.add('hidden');
            deathMenu.classList.add('hidden');
            scoreEl.innerText = score;
            updateGateSystem();
        }

        function die() {
            if (gameState === 'DEAD') return;
            gameState = 'DEAD';
            finalScoreEl.innerText = `${score} POINTS`;
            finalGateEl.innerText = `REACHED GATE ${currentGate}`;
            deathMenu.classList.remove('hidden');
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            // Sensitive Relative Control
            if (isDragging) {
                const diff = currentTouchX - startTouchX;
                player.vx += diff * STEER_SENSITIVITY;
            }
            
            player.vx *= FRICTION;
            player.x += player.vx;

            // Screen Bounds
            if (player.x < PLAYER_RADIUS || player.x > width - PLAYER_RADIUS) die();

            // Hitbox Linger
            player.history.push({ x: player.x, y: player.y, time: Date.now() });
            player.history = player.history.filter(h => Date.now() - h.time < HITBOX_LINGER_MS);

            updateGateSystem();

            // Obstacle Spawning Frequency
            let spawnRate = 40;
            if (currentGate === 2) spawnRate = 30;
            if (currentGate === 3) spawnRate = 20;
            if (currentGate === 4) spawnRate = 12;

            if (frame % spawnRate === 0) createObstacle();

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let o = obstacles[i];
                o.y += speed * o.speedMult;
                if (o.vx) o.x += o.vx;

                if (o.type === 'gate') {
                    if (o.y > player.y - PLAYER_RADIUS && o.y < player.y + PLAYER_RADIUS + GATE_HEIGHT) {
                        if (player.x - PLAYER_RADIUS < o.gapX || player.x + PLAYER_RADIUS > o.gapX + GATE_WIDTH) {
                            die();
                        } else if (!o.passed && o.y > player.y) {
                            o.passed = true;
                            score++;
                            scoreEl.innerText = score;
                        }
                    }
                } else {
                    // Circle-Rect collision for Interceptors
                    let testX = player.x;
                    let testY = player.y;
                    if (player.x < o.x) testX = o.x;
                    else if (player.x > o.x + o.w) testX = o.x + o.w;
                    if (player.y < o.y) testY = o.y;
                    else if (player.y > o.y + o.h) testY = o.y + o.h;

                    const distX = player.x - testX;
                    const distY = player.y - testY;
                    const distance = Math.sqrt((distX * distX) + (distY * distY));

                    if (distance <= PLAYER_RADIUS) {
                        die();
                    }
                    
                    // Award points for dodging interceptors
                    if (!o.passed && o.y > player.y + 50) {
                        o.passed = true;
                        score++;
                        scoreEl.innerText = score;
                    }
                }

                if (o.y > height + 100) obstacles.splice(i, 1);
            }
            frame++;
        }

        function draw() {
            ctx.fillStyle = '#020202';
            ctx.fillRect(0, 0, width, height);

            if (gameState === 'PLAYING' || gameState === 'DEAD') {
                // Background grid pulses with gate number
                ctx.strokeStyle = `rgba(255, 255, 255, ${0.02 * currentGate})`;
                for(let i = 0; i < width; i += 60) {
                    ctx.beginPath();
                    ctx.moveTo(i, 0); ctx.lineTo(i, height);
                    ctx.stroke();
                }

                obstacles.forEach(o => {
                    if (o.type === 'gate') {
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, o.y, o.gapX, GATE_HEIGHT);
                        ctx.fillRect(o.gapX + GATE_WIDTH, o.y, width - (o.gapX + GATE_WIDTH), GATE_HEIGHT);
                        if (showHitboxes) {
                            ctx.strokeStyle = '#ff0000';
                            ctx.strokeRect(0, o.y, o.gapX, GATE_HEIGHT);
                            ctx.strokeRect(o.gapX + GATE_WIDTH, o.y, width - (o.gapX + GATE_WIDTH), GATE_HEIGHT);
                        }
                    } else {
                        ctx.fillStyle = o.color;
                        ctx.fillRect(o.x, o.y, o.w, o.h);
                        if (showHitboxes) {
                            ctx.strokeStyle = '#ff0000';
                            ctx.strokeRect(o.x, o.y, o.w, o.h);
                        }
                    }
                });

                // Debug Hitbox Linger
                if (showHitboxes) {
                    player.history.forEach(h => {
                        ctx.strokeStyle = 'rgba(0, 150, 255, 0.3)';
                        ctx.beginPath();
                        ctx.arc(h.x, h.y, PLAYER_RADIUS, 0, Math.PI * 2);
                        ctx.stroke();
                    });
                }

                // Player Ship
                ctx.save();
                ctx.translate(player.x, player.y);
                ctx.rotate(player.vx * 0.02);
                ctx.shadowBlur = 15;
                ctx.shadowColor = player.color;
                ctx.fillStyle = player.color;
                ctx.beginPath();
                ctx.moveTo(0, -PLAYER_RADIUS * 1.5);
                ctx.lineTo(PLAYER_RADIUS, PLAYER_RADIUS);
                ctx.lineTo(-PLAYER_RADIUS, PLAYER_RADIUS);
                ctx.closePath();
                ctx.fill();

                if (showHitboxes) {
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = '#0066ff';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(0, 0, PLAYER_RADIUS, 0, Math.PI * 2);
                    ctx.stroke();
                }
                ctx.restore();

                // Input Bar
                if (isDragging) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                    ctx.fillRect(0, height - 5, width, 5);
                    ctx.fillStyle = '#00ffcc';
                    const barWidth = Math.abs(currentTouchX - startTouchX);
                    ctx.fillRect(startTouchX, height - 5, currentTouchX - startTouchX, 5);
                }
            }

            requestAnimationFrame(() => {
                update();
                draw();
            });
        }

        draw();
    </script>
</body>
</html>
