<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wall Ball</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0a0a0a;
            color: white;
            font-family: sans-serif;
        }

        #game-viewport {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #arena {
            position: relative;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #111 0%, #050505 100%);
            border-right: 8px solid #333; /* The Wall */
        }

        .player {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            z-index: 10;
        }

        .p1 { background: #3b82f6; box-shadow: 0 0 15px #3b82f6; }
        .p2 { background: #ef4444; box-shadow: 0 0 15px #ef4444; }

        .ball {
            position: absolute;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 15px #fff;
            z-index: 20;
            display: block !important;
        }

        .stamina-container {
            position: absolute;
            top: -10px;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .stamina-bar {
            height: 100%;
            width: 100%;
            transition: width 0.05s linear;
        }

        .p1-bar { background: #60a5fa; }
        .p2-bar { background: #f87171; }

        .ui {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 40px;
            font-size: 2rem;
            font-weight: bold;
            pointer-events: none;
            opacity: 0.5;
        }

        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
        }

        .btn {
            margin-top: 20px;
            padding: 10px 30px;
            border: 2px solid white;
            background: transparent;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background: white;
            color: black;
        }
    </style>
</head>
<body>

    <div id="game-viewport">
        <div id="arena">
            <div id="p1" class="player p1">1
                <div class="stamina-container">
                    <div id="p1-stamina" class="stamina-bar p1-bar"></div>
                </div>
            </div>
            <div id="p2" class="player p2">2
                <div class="stamina-container">
                    <div id="p2-stamina" class="stamina-bar p2-bar"></div>
                </div>
            </div>
            <div id="ball" class="ball"></div>
        </div>

        <div class="ui">
            <span id="s1">0</span>
            <span>-</span>
            <span id="s2">0</span>
        </div>

        <div id="overlay">
            <h1 class="text-4xl font-bold italic mb-4">WALL BALL</h1>
            <div class="flex gap-10 text-sm opacity-80">
                <div>
                    <p class="text-blue-400 font-bold">P1 (Blue)</p>
                    <p>WASD to Move</p>
                    <p>L-SHIFT to Sprint</p>
                    <p>SPACE to Hit</p>
                </div>
                <div>
                    <p class="text-red-400 font-bold">P2 (Red)</p>
                    <p>Arrows to Move</p>
                    <p>COMMA ( , ) for Power Shot</p>
                    <p class="text-[10px] mt-1 italic">Power depends on Stamina bar!</p>
                </div>
            </div>
            <button class="btn" onclick="start()">START MATCH</button>
        </div>
    </div>

    <script>
        const p1El = document.getElementById('p1');
        const p2El = document.getElementById('p2');
        const ballEl = document.getElementById('ball');
        const s1El = document.getElementById('s1');
        const s2El = document.getElementById('s2');
        const overlay = document.getElementById('overlay');
        const p1StamEl = document.getElementById('p1-stamina');
        const p2StamEl = document.getElementById('p2-stamina');

        let width = window.innerWidth;
        let height = window.innerHeight;
        let active = false;
        let score = [0, 0];

        const state = {
            p1: { x: 100, y: height/2, vx: 0, vy: 0, stam: 100 },
            p2: { x: 200, y: height/2, vx: 0, vy: 0, stam: 100 },
            ball: { x: width/2, y: height/2, vx: 0, vy: 0, last: 0 }
        };

        const keys = {};
        window.onkeydown = (e) => keys[e.key] = true;
        window.onkeyup = (e) => keys[e.key] = false;

        function start() {
            overlay.style.display = 'none';
            active = true;
            resetBall();
            loop();
        }

        function resetBall() {
            state.ball.x = width * 0.3;
            state.ball.y = height / 2;
            state.ball.vx = 0;
            state.ball.vy = 0;
            state.ball.last = 0;
            // Ensure ball is visible
            ballEl.style.display = 'block';
        }

        function hit(pNum) {
            const p = pNum === 1 ? state.p1 : state.p2;
            const dx = (p.x + 15) - (state.ball.x + 8);
            const dy = (p.y + 15) - (state.ball.y + 8);
            const dist = Math.sqrt(dx*dx + dy*dy);

            // Distance check for hitting the ball (50px range)
            if (dist < 55 && state.ball.vx <= 0) {
                state.ball.last = pNum;
                
                if (pNum === 2) {
                    // Power Shot scaling: min 8 speed, max 24 speed based on stamina
                    const powerFactor = state.p2.stam / 100;
                    state.ball.vx = 8 + (powerFactor * 16);
                    state.p2.stam = 0; // Consume all stamina
                } else {
                    // Standard hit
                    state.ball.vx = 11;
                }
                
                state.ball.vy = (Math.random() - 0.5) * 12;
            }
        }

        function loop() {
            if (!active) return;

            // P1 Movement (Sprint Ability)
            const p1Sprint = keys['Shift'] && state.p1.stam > 5;
            const p1Speed = p1Sprint ? 10 : 6;
            if (p1Sprint) state.p1.stam = Math.max(0, state.p1.stam - 1.5);
            else state.p1.stam = Math.min(100, state.p1.stam + 0.5);

            if (keys['w'] || keys['W']) state.p1.y -= p1Speed;
            if (keys['s'] || keys['S']) state.p1.y += p1Speed;
            if (keys['a'] || keys['A']) state.p1.x -= p1Speed;
            if (keys['d'] || keys['D']) state.p1.x += p1Speed;

            // P2 Movement (Static Speed)
            if (keys['ArrowUp']) state.p2.y -= 6;
            if (keys['ArrowDown']) state.p2.y += 6;
            if (keys['ArrowLeft']) state.p2.x -= 6;
            if (keys['ArrowRight']) state.p2.x += 6;
            
            // P2 Stamina Regen (Slowly)
            state.p2.stam = Math.min(100, state.p2.stam + 0.25);

            // Hit Triggers
            if (keys[' ']) hit(1);
            if (keys[',']) hit(2);

            // Ball Physics
            state.ball.x += state.ball.vx;
            state.ball.y += state.ball.vy;

            // Wall Collision (Right Side)
            if (state.ball.x > width - 24) {
                state.ball.vx *= -1;
                state.ball.x = width - 24;
            }
            
            // Ceiling/Floor Collision
            if (state.ball.y < 0) {
                state.ball.y = 0;
                state.ball.vy *= -1;
            }
            if (state.ball.y > height - 16) {
                state.ball.y = height - 16;
                state.ball.vy *= -1;
            }

            // Player Bounds
            [state.p1, state.p2].forEach(p => {
                p.x = Math.max(0, Math.min(width - 50, p.x));
                p.y = Math.max(0, Math.min(height - 30, p.y));
            });

            // Scoring (Ball goes past the players on the left)
            if (state.ball.x < -20) {
                if (state.ball.last === 1) {
                    score[1]++;
                    s2El.innerText = score[1];
                } else {
                    score[0]++;
                    s1El.innerText = score[0];
                }
                resetBall();
            }

            // Render
            p1El.style.left = `${state.p1.x}px`;
            p1El.style.top = `${state.p1.y}px`;
            p2El.style.left = `${state.p2.x}px`;
            p2El.style.top = `${state.p2.y}px`;
            ballEl.style.left = `${state.ball.x}px`;
            ballEl.style.top = `${state.ball.y}px`;
            
            p1StamEl.style.width = state.p1.stam + '%';
            p2StamEl.style.width = state.p2.stam + '%';

            requestAnimationFrame(loop);
        }

        window.onresize = () => {
            width = window.innerWidth;
            height = window.innerHeight;
        };
    </script>
</body>
</html>
