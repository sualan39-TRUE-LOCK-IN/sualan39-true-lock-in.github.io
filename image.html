<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Object Tracker</title>
    <!-- Load ml5.js and p5.js (for easy canvas handling) -->
    <script src="https://cdnjs.cloudflare.com"></script>
    <script src="https://unpkg.com"></script>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #333; color: white; flex-direction: column; }
        canvas { border: 2px solid #fff; border-radius: 8px; }
        #status { position: absolute; top: 10px; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="status">Loading Model...</div>
    <script>
        let video;
        let detector;
        let detections = [];
        let modelLoaded = false;

        function setup() {
            createCanvas(640, 480);
            
            // Start webcam
            video = createCapture(VIDEO);
            video.size(640, 480);
            video.hide(); // Hide the raw HTML video element

            // Load COCO-SSD model (object detection)
            detector = ml5.objectDetector('cocossd', modelReady);
        }

        function modelReady() {
            document.getElementById('status').innerText = 'Model Loaded - Detecting...';
            modelLoaded = true;
            detect(); // Start detection loop
        }

        function detect() {
            detector.detect(video, gotDetections);
        }

        function gotDetections(error, results) {
            if (error) console.error(error);
            detections = results; // Update detection results
            if (modelLoaded) {
                detect(); // Call again immediately for next frame
            }
        }

        function draw() {
            background(0);
            image(video, 0, 0); // Draw video frame

            // Draw bounding boxes and labels
            for (let i = 0; i < detections.length; i++) {
                let object = detections[i];
                stroke(0, 255, 0);
                strokeWeight(4);
                noFill();
                rect(object.x, object.y, object.width, object.height);
                noStroke();
                fill(0, 255, 0);
                textSize(24);
                text(object.label + " " + nf(object.confidence * 100, 0, 1) + "%", object.x + 10, object.y + 24);
            }
        }
    </script>
</body>
</html>
