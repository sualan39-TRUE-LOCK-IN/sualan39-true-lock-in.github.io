<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>tetris</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --fg: #ffffff;
            --font: 'Google Sans', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: var(--font);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: none;
        }

        #game-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        #stats {
            display: flex;
            gap: 40px;
            font-size: 24px;
            font-weight: 400;
            letter-spacing: -0.5px;
        }

        canvas {
            border: 2px solid var(--fg);
            background-color: var(--bg);
            max-height: 70vh;
            max-width: 90vw;
            image-rendering: pixelated;
        }

        #controls {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 60px);
            gap: 10px;
            margin-top: 10px;
        }

        @media (min-width: 768px) {
            #controls {
                display: none;
            }
        }

        .btn {
            width: 60px;
            height: 60px;
            border: 1px solid var(--fg);
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
        }

        .btn svg {
            fill: var(--fg);
            width: 24px;
            height: 24px;
        }

        .btn:active {
            background: var(--fg);
        }
        .btn:active svg {
            fill: var(--bg);
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }

        #overlay.hidden {
            display: none;
        }

        #ai-indicator {
            position: absolute;
            top: -30px;
            right: 0;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #ai-indicator.active {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ai-indicator">auto</div>
        <div id="stats">
            <div id="score">0</div>
            <div id="high-score">0</div>
        </div>

        <canvas id="tetris"></canvas>

        <div id="overlay">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="white">
                <path d="M8 5v14l11-7z"/>
            </svg>
        </div>

        <div id="controls">
            <div></div>
            <button class="btn" id="ctrl-up">
                <svg viewBox="0 0 24 24"><path d="M12 8l-6 6 1.41 1.41L12 10.83l4.59 4.58L18 14z"/></svg>
            </button>
            <div></div>
            <button class="btn" id="ctrl-left">
                <svg viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6z"/></svg>
            </button>
            <button class="btn" id="ctrl-down">
                <svg viewBox="0 0 24 24"><path d="M12 16l6-6-1.41-1.41L12 13.17 7.41 8.59 6 10z"/></svg>
            </button>
            <button class="btn" id="ctrl-right">
                <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('high-score');
        const overlay = document.getElementById('overlay');
        const aiIndicator = document.getElementById('ai-indicator');

        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 30;

        canvas.width = COLS * BLOCK_SIZE;
        canvas.height = ROWS * BLOCK_SIZE;

        let highScore = localStorage.getItem('tetris-high-score') || 0;
        highScoreElement.innerText = highScore;

        function createPiece(type) {
            if (type === 'I') return [[0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0]];
            if (type === 'L') return [[0, 1, 0], [0, 1, 0], [0, 1, 1]];
            if (type === 'J') return [[0, 1, 0], [0, 1, 0], [1, 1, 0]];
            if (type === 'O') return [[1, 1], [1, 1]];
            if (type === 'Z') return [[1, 1, 0], [0, 1, 1], [0, 0, 0]];
            if (type === 'S') return [[0, 1, 1], [1, 1, 0], [0, 0, 0]];
            if (type === 'T') return [[0, 1, 0], [1, 1, 1], [0, 0, 0]];
        }

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) matrix.push(new Array(w).fill(0));
            return matrix;
        }

        function draw() {
            context.fillStyle = '#000';
            context.fillRect(0, 0, canvas.width, canvas.height);
            drawMatrix(player.matrix, {x: 0, y: 0});
            if (player.piece) drawMatrix(player.piece, player.pos);
        }

        function drawMatrix(matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        context.fillStyle = '#fff';
                        context.fillRect((x + offset.x) * BLOCK_SIZE, (y + offset.y) * BLOCK_SIZE, BLOCK_SIZE - 1, BLOCK_SIZE - 1);
                    }
                });
            });
        }

        function collide(arena, piece, pos) {
            for (let y = 0; y < piece.length; ++y) {
                for (let x = 0; x < piece[y].length; ++x) {
                    if (piece[y][x] !== 0 && (arena[y + pos.y] && arena[y + pos.y][x + pos.x]) !== 0) return true;
                }
            }
            return false;
        }

        function merge(arena, player) {
            player.piece.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value;
                });
            });
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) matrix.forEach(row => row.reverse());
            else matrix.reverse();
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(player.matrix, player.piece, player.pos)) {
                player.pos.y--;
                merge(player.matrix, player);
                playerReset();
                arenaSweep();
                updateScore();
            }
            dropCounter = 0;
        }

        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(player.matrix, player.piece, player.pos)) player.pos.x -= dir;
        }

        function playerRotate(dir) {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.piece, dir);
            while (collide(player.matrix, player.piece, player.pos)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.piece[0].length) {
                    rotate(player.piece, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
        }

        function playerReset() {
            const pieces = 'ILJOTSZ';
            player.piece = createPiece(pieces[pieces.length * Math.random() | 0]);
            player.pos.y = 0;
            player.pos.x = (player.matrix[0].length / 2 | 0) - (player.piece[0].length / 2 | 0);
            
            if (collide(player.matrix, player.piece, player.pos)) {
                player.matrix.forEach(row => row.fill(0));
                if (player.score > highScore) {
                    highScore = player.score;
                    localStorage.setItem('tetris-high-score', highScore);
                    highScoreElement.innerText = highScore;
                }
                player.score = 0;
                updateScore();
            }

            if (aiActive) aiThink();
        }

        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = player.matrix.length - 1; y > 0; --y) {
                for (let x = 0; x < player.matrix[y].length; ++x) {
                    if (player.matrix[y][x] === 0) continue outer;
                }
                const row = player.matrix.splice(y, 1)[0].fill(0);
                player.matrix.unshift(row);
                ++y;
                player.score += rowCount * 10;
                rowCount *= 2;
            }
        }

        function updateScore() {
            scoreElement.innerText = player.score;
        }

        // --- SUPERHUMAN AI LOGIC ---
        let aiActive = false;
        let aiTargetX = null;
        let aiTargetRotation = 0;

        function aiThink() {
            let bestScore = -Infinity;
            let bestX = 0;
            let bestRot = 0;

            const originalPiece = JSON.parse(JSON.stringify(player.piece));
            
            for (let r = 0; r < 4; r++) {
                const currentPiece = JSON.parse(JSON.stringify(originalPiece));
                for(let i=0; i<r; i++) rotate(currentPiece, 1);

                for (let x = -3; x < COLS + 3; x++) {
                    let y = 0;
                    if (collide(player.matrix, currentPiece, {x, y})) continue;

                    while (!collide(player.matrix, currentPiece, {x, y: y + 1})) {
                        y++;
                    }

                    const score = evaluateBoard(player.matrix, currentPiece, {x, y});
                    if (score > bestScore) {
                        bestScore = score;
                        bestX = x;
                        bestRot = r;
                    }
                }
            }
            aiTargetX = bestX;
            aiTargetRotation = bestRot;
        }

        function evaluateBoard(matrix, piece, pos) {
            const tempMatrix = JSON.parse(JSON.stringify(matrix));
            piece.forEach((row, py) => {
                row.forEach((val, px) => {
                    if (val !== 0) tempMatrix[py + pos.y][px + pos.x] = 1;
                });
            });

            let linesCleared = 0;
            for (let y = 0; y < ROWS; y++) {
                if (tempMatrix[y].every(v => v !== 0)) linesCleared++;
            }

            const heights = new Array(COLS).fill(0);
            let holes = 0;
            let totalHeight = 0;
            for (let x = 0; x < COLS; x++) {
                let colHeight = 0;
                let foundBlock = false;
                for (let y = 0; y < ROWS; y++) {
                    if (tempMatrix[y][x] !== 0) {
                        if (!foundBlock) {
                            colHeight = ROWS - y;
                            foundBlock = true;
                        }
                    } else if (foundBlock) {
                        holes++;
                    }
                }
                heights[x] = colHeight;
                totalHeight += colHeight;
            }

            let bumpiness = 0;
            for (let x = 0; x < COLS - 1; x++) {
                bumpiness += Math.abs(heights[x] - heights[x+1]);
            }

            // Heuristics constants
            return (linesCleared * 50) - (totalHeight * 1.5) - (holes * 15) - (bumpiness * 1.2);
        }

        function aiExecute() {
            if (!aiActive || player.piece === null) return;
            
            // Execute rotation
            if (aiTargetRotation > 0) {
                playerRotate(1);
                aiTargetRotation--;
                return;
            }

            // Execute movement
            if (player.pos.x < aiTargetX) playerMove(1);
            else if (player.pos.x > aiTargetX) playerMove(-1);
            else playerDrop(); // Slam down when in position
        }

        const player = {
            pos: {x: 0, y: 0},
            piece: null,
            matrix: createMatrix(COLS, ROWS),
            score: 0,
        };

        playerReset();

        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        let paused = true;

        function update(time = 0) {
            if (paused) return;
            const deltaTime = time - lastTime;
            lastTime = time;

            if (aiActive) {
                aiExecute();
            } else {
                dropCounter += deltaTime;
                if (dropCounter > dropInterval) playerDrop();
            }

            draw();
            requestAnimationFrame(update);
        }

        document.addEventListener('keydown', event => {
            const key = event.key.toLowerCase();
            if (key === 'q') {
                aiActive = !aiActive;
                aiIndicator.classList.toggle('active', aiActive);
                if (aiActive) aiThink();
                return;
            }

            if (paused) return;
            if (event.keyCode === 37 || key === 'a') playerMove(-1);
            else if (event.keyCode === 39 || key === 'd') playerMove(1);
            else if (event.keyCode === 40 || key === 's') playerDrop();
            else if (event.keyCode === 38 || key === 'w') playerRotate(1);
        });

        const touchHandler = (action) => (e) => {
            e.preventDefault();
            if (paused) return;
            action();
            draw();
        };

        document.getElementById('ctrl-left').addEventListener('touchstart', touchHandler(() => playerMove(-1)));
        document.getElementById('ctrl-right').addEventListener('touchstart', touchHandler(() => playerMove(1)));
        document.getElementById('ctrl-up').addEventListener('touchstart', touchHandler(() => playerRotate(1)));
        document.getElementById('ctrl-down').addEventListener('touchstart', touchHandler(() => playerDrop()));

        overlay.addEventListener('click', () => {
            overlay.classList.add('hidden');
            paused = false;
            lastTime = performance.now();
            requestAnimationFrame(update);
        });

        draw();
    </script>
</body>
</html>
