<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bad Apple High-Fidelity ASCII</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #000; 
            color: #fff; 
            margin: 0; 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            font-family: 'Courier New', Courier, monospace; 
        }
        #ascii-container {
            line-height: 7px;
            letter-spacing: 0;
            white-space: pre;
            font-size: 7px;
            font-weight: 900;
            text-align: center;
            color: #fff;
            text-shadow: 0 0 2px rgba(255,255,255,0.5);
        }
        .overlay { 
            position: absolute; 
            inset: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            background: rgba(0,0,0,0.95); 
            z-index: 50; 
        }
        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid #FFF;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }
        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="init-screen" class="overlay">
        <h1 class="text-3xl font-black mb-6 tracking-[0.2em]">BAD APPLE</h1>
        <div id="status-area" class="flex flex-col items-center">
            <button id="start-btn" class="bg-white text-black px-10 py-4 font-black hover:bg-gray-200 transition-all transform hover:scale-105 active:scale-95">
                START VIDEO
            </button>
            <p id="status-text" class="mt-6 text-gray-500 text-xs font-mono uppercase tracking-widest text-center max-w-xs"></p>
        </div>
    </div>

    <pre id="ascii-container"></pre>

    <video id="video-source" crossorigin="anonymous" style="display:none;" loop playsinline muted>
        <source src="https://raw.githubusercontent.com/EmirXK/bad_apple/main/bad_apple.mp4" type="video/mp4">
    </video>

    <script>
        const video = document.getElementById('video-source');
        const container = document.getElementById('ascii-container');
        const startBtn = document.getElementById('start-btn');
        const statusText = document.getElementById('status-text');
        const initScreen = document.getElementById('init-screen');

        const chars = "@#$&890654321*()_ "; 
        const WIDTH = 150; 
        const HEIGHT = 56;

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        canvas.width = WIDTH;
        canvas.height = HEIGHT;

        async function init() {
            statusText.innerHTML = '<span class="loader mb-4"></span><br>CONNECTING TO GITHUB...<br>(THIS MAY TAKE A MOMENT)';
            startBtn.style.display = 'none';

            try {
                // Reset video and attempt load
                video.pause();
                video.currentTime = 0;
                video.load();

                // Wait for video to be ready with a longer timeout (30s)
                await new Promise((resolve, reject) => {
                    const timeout = setTimeout(() => {
                        cleanup();
                        reject(new Error("Connection Timeout (30s)"));
                    }, 30000);

                    const onCanPlay = () => {
                        cleanup();
                        resolve();
                    };

                    const onError = () => {
                        cleanup();
                        reject(new Error("Video source could not be reached"));
                    };

                    function cleanup() {
                        clearTimeout(timeout);
                        video.removeEventListener('canplay', onCanPlay);
                        video.removeEventListener('error', onError);
                    }

                    video.addEventListener('canplay', onCanPlay);
                    video.addEventListener('error', onError);
                });

                await video.play();
                initScreen.style.display = 'none';
                render();
            } catch (err) {
                console.error("Init error:", err);
                statusText.innerHTML = `<span class="text-red-500 font-bold text-lg">FAILED</span><br>${err.message}<br><span class="text-[10px] mt-2 block">Check your internet connection or try refreshing.</span>`;
                startBtn.style.display = 'block';
                startBtn.textContent = "RETRY CONNECTION";
            }
        }

        function render() {
            if (video.paused || video.ended) return;

            try {
                ctx.drawImage(video, 0, 0, WIDTH, HEIGHT);
                const pixels = ctx.getImageData(0, 0, WIDTH, HEIGHT).data;
                
                let ascii = "";
                for (let y = 0; y < HEIGHT; y++) {
                    for (let x = 0; x < WIDTH; x++) {
                        const i = (y * WIDTH + x) * 4;
                        const brightness = (0.2126 * pixels[i] + 0.7152 * pixels[i+1] + 0.0722 * pixels[i+2]);
                        const charIndex = Math.floor((brightness / 255) * (chars.length - 1));
                        ascii += chars[charIndex];
                    }
                    ascii += "\n";
                }
                container.textContent = ascii;
            } catch (e) {
                console.error("Frame capture failed:", e);
            }
            
            requestAnimationFrame(render);
        }

        startBtn.onclick = init;
    </script>
</body>
</html>
