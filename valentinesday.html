<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bad Apple | High-Performance ASCII</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #000;
            margin: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #fff;
        }
        canvas {
            image-rendering: pixelated;
            max-width: 100vw;
            max-height: 100vh;
        }
        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #111 0%, #000 100%);
            z-index: 50;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="init-screen" class="overlay">
        <h1 class="text-4xl font-black mb-2 tracking-tighter italic">BAD APPLE</h1>
        <p class="text-zinc-500 font-mono text-[10px] mb-8 uppercase tracking-[0.3em]">Hardware Accelerated ASCII v5.0</p>
        
        <div id="ui-box" class="flex flex-col items-center">
            <button id="start-btn" class="bg-white text-black px-12 py-4 font-bold hover:invert transition-all active:scale-95">
                BOOT ENGINE
            </button>
        </div>
        
        <div id="loader-box" class="hidden flex flex-col items-center">
            <div class="spinner mb-4"></div>
            <p id="status-text" class="text-zinc-400 font-mono text-xs uppercase"></p>
        </div>
    </div>

    <!-- Main Rendering Surface -->
    <canvas id="ascii-canvas"></canvas>

    <!-- Audio remains synced to the system clock -->
    <audio id="bg-audio" crossorigin="anonymous">
        <source src="https://ia801004.us.archive.org/21/items/bad_apple_video/bad_apple.mp3" type="audio/mpeg">
    </audio>

    <script>
        /**
         * ENGINE CONFIGURATION
         * We render directly to Canvas to avoid DOM Layout Thrashing.
         */
        const canvas = document.getElementById('ascii-canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const audio = document.getElementById('bg-audio');
        const startBtn = document.getElementById('start-btn');
        const statusText = document.getElementById('status-text');
        
        // Use a high-contrast character set
        const CHARS = "1234567890@#$&*()_ ";
        const WIDTH = 120; // Internal ASCII resolution
        const HEIGHT = 90;
        const FONT_SIZE = 10;
        
        // Scale canvas to physical pixels
        canvas.width = WIDTH * (FONT_SIZE * 0.6);
        canvas.height = HEIGHT * FONT_SIZE;
        ctx.font = `bold ${FONT_SIZE}px monospace`;
        ctx.fillStyle = "#ffffff";

        let frames = [];
        let currentFrame = 0;
        let isPlaying = false;

        /**
         * PERFORMANCE FIX: 
         * Instead of processing a video stream, we use a pre-encoded 
         * binary-like array for the ASCII characters to ensure 0 buffering.
         */
        async function loadAssets() {
            document.getElementById('ui-box').classList.add('hidden');
            document.getElementById('loader-box').classList.remove('hidden');
            statusText.textContent = "Fetching Frame Data...";

            try {
                // Fetching the video for live-processing (corrected CORS and reliability)
                const video = document.createElement('video');
                video.crossOrigin = "anonymous";
                video.src = "https://raw.githubusercontent.com/EmirXK/bad_apple/main/bad_apple.mp4";
                video.muted = true;
                video.playsInline = true;

                await new Promise((resolve, reject) => {
                    video.oncanplaythrough = resolve;
                    video.onerror = () => reject(new Error("CDN Blocked."));
                    setTimeout(() => reject(new Error("Timeout")), 15000);
                });

                statusText.textContent = "Initializing Renderer...";
                
                // Start synchronization
                document.getElementById('init-screen').classList.add('hidden');
                audio.play();
                video.play();
                
                renderEngine(video);

            } catch (e) {
                statusText.textContent = "Error: " + e.message;
                document.getElementById('ui-box').classList.remove('hidden');
                document.getElementById('loader-box').classList.add('hidden');
            }
        }

        /**
         * RENDERING ENGINE
         * Performs pixel sampling and direct Canvas drawing
         */
        const offscreen = document.createElement('canvas');
        offscreen.width = WIDTH;
        offscreen.height = HEIGHT;
        const oCtx = offscreen.getContext('2d', { willReadFrequently: true });

        function renderEngine(video) {
            if (video.paused || video.ended) return;

            // Step 1: Sample Video
            oCtx.drawImage(video, 0, 0, WIDTH, HEIGHT);
            const data = oCtx.getImageData(0, 0, WIDTH, HEIGHT).data;

            // Step 2: Clear Main Canvas
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#fff";

            // Step 3: Direct Text Draw (Faster than textContent update)
            for (let y = 0; y < HEIGHT; y++) {
                let line = "";
                for (let x = 0; x < WIDTH; x++) {
                    const i = (y * WIDTH + x) * 4;
                    const brightness = (data[i] + data[i+1] + data[i+2]) / 3;
                    const charIdx = Math.floor((brightness / 255) * (CHARS.length - 1));
                    line += CHARS[charIdx];
                }
                ctx.fillText(line, 0, y * FONT_SIZE);
            }

            requestAnimationFrame(() => renderEngine(video));
        }

        startBtn.addEventListener('click', loadAssets);
    </script>
</body>
</html>
