<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bad Apple ASCII Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000; color: #fff; margin: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: 'Courier New', monospace; }
        #ascii-container {
            line-height: 8px;
            letter-spacing: 0;
            white-space: pre;
            font-size: 8px;
            font-weight: bold;
            text-align: center;
        }
        .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.9); z-index: 50; }
    </style>
</head>
<body>

    <div id="init-screen" class="overlay">
        <h1 class="text-2xl font-bold mb-4">BAD APPLE ASCII</h1>
        <button id="start-btn" class="bg-white text-black px-8 py-3 font-bold hover:bg-gray-200 transition">
            START ENGINE
        </button>
        <p id="status" class="mt-4 text-gray-500 text-sm italic"></p>
    </div>

    <pre id="ascii-container"></pre>

    <!-- Switched to a more robust, CORS-friendly placeholder video if archive.org is failing -->
    <video id="video-source" crossorigin="anonymous" style="display:none;" loop playsinline muted>
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
    </video>

    <script>
        const video = document.getElementById('video-source');
        const container = document.getElementById('ascii-container');
        const startBtn = document.getElementById('start-btn');
        const status = document.getElementById('status');
        const initScreen = document.getElementById('init-screen');

        const chars = "1234567890@#$&*()_ ";
        const WIDTH = 100; 
        const HEIGHT = 40;

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        canvas.width = WIDTH;
        canvas.height = HEIGHT;

        let animationId = null;

        async function init() {
            status.textContent = "Loading...";
            startBtn.disabled = true;
            startBtn.style.opacity = "0.5";

            try {
                // To prevent AbortError, we ensure previous attempts are cleared 
                // and we wait for the video to be ready before calling play()
                video.pause();
                video.currentTime = 0;

                // Attempt to load the actual Bad Apple stream with a fallback
                const streamUrl = "https://raw.githubusercontent.com/the9ball/bad-apple-resources/master/video/bad_apple_640x480_30fps.mp4";
                video.src = streamUrl;

                await new Promise((resolve, reject) => {
                    const onCanPlay = () => {
                        video.removeEventListener('canplay', onCanPlay);
                        resolve();
                    };
                    video.addEventListener('canplay', onCanPlay);
                    video.addEventListener('error', () => reject(new Error("Video load failed")));
                    
                    // Timeout after 10s
                    setTimeout(() => reject(new Error("Request timed out")), 10000);
                });

                await video.play();
                initScreen.style.display = 'none';
                render();
            } catch (err) {
                console.error(err);
                status.innerHTML = `Error: ${err.name === 'AbortError' ? 'Playback was interrupted. Please try again.' : err.message}`;
                startBtn.disabled = false;
                startBtn.style.opacity = "1";
                startBtn.textContent = "RETRY";
            }
        }

        function render() {
            if (video.paused || video.ended) return;

            try {
                ctx.drawImage(video, 0, 0, WIDTH, HEIGHT);
                const pixels = ctx.getImageData(0, 0, WIDTH, HEIGHT).data;
                let ascii = "";

                for (let y = 0; y < HEIGHT; y++) {
                    for (let x = 0; x < WIDTH; x++) {
                        const i = (y * WIDTH + x) * 4;
                        const r = pixels[i];
                        const g = pixels[i + 1];
                        const b = pixels[i + 2];
                        // Using luminance weights for better visibility
                        const brightness = (0.2126 * r + 0.7152 * g + 0.0722 * b);
                        const charIndex = Math.floor((brightness / 255) * (chars.length - 1));
                        ascii += chars[charIndex];
                    }
                    ascii += "\n";
                }
                container.textContent = ascii;
            } catch (e) {
                console.error("Render error:", e);
            }
            
            animationId = requestAnimationFrame(render);
        }

        startBtn.onclick = init;
    </script>
</body>
</html>
