<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>gravity glitchers</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f5f5f7; color: #1d1d1f; overflow: hidden; margin: 0; touch-action: none; -webkit-user-select: none; }
        .apple-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(25px); border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); border: 1px solid rgba(255,255,255,0.3); }
        .btn-select { transition: all 0.2s ease; border: 1.5px solid #d2d2d7; }
        .btn-select.active { border-color: #0071e3; background: #0071e3; color: white; transform: scale(1.02); }
        canvas { display: block; background: #ffffff; cursor: crosshair; }
        .bar-container { height: 6px; background: #e5e5ea; border-radius: 3px; overflow: hidden; width: 100%; }
        .bar-fill { height: 100%; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .lowercase { text-transform: lowercase; }
        .hud-item { background: rgba(255,255,255,0.7); backdrop-filter: blur(10px); padding: 12px; border-radius: 14px; width: 140px; }
    </style>
</head>
<body class="lowercase">

    <div id="toast-container" class="fixed bottom-6 left-6 z-[100] space-y-2 pointer-events-none"></div>

    <div id="server-status" class="fixed inset-0 z-[100] bg-white flex flex-col items-center justify-center p-6 text-center">
        <div class="w-10 h-10 border-4 border-gray-100 border-t-blue-500 rounded-full animate-spin"></div>
        <h2 class="mt-6 text-lg font-light tracking-tight">connecting to arena</h2>
    </div>

    <!-- setup screen -->
    <div id="setup" class="fixed inset-0 z-50 flex items-center justify-center p-6">
        <div class="apple-card w-full max-w-md p-8 space-y-6">
            <header class="text-center">
                <h1 class="text-4xl font-light tracking-tighter">gravity glitchers</h1>
            </header>

            <div class="space-y-4">
                <div>
                    <p class="text-[10px] font-bold text-gray-400 mb-2 ml-1">class</p>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="setType('scout')" id="type-scout" class="btn-select p-3 rounded-xl text-xs active">scout</button>
                        <button onclick="setType('tank')" id="type-tank" class="btn-select p-3 rounded-xl text-xs">tank</button>
                        <button onclick="setType('mage')" id="type-mage" class="btn-select p-3 rounded-xl text-xs">mage</button>
                    </div>
                </div>

                <div id="class-stats" class="bg-gray-50/50 p-4 rounded-2xl space-y-2">
                    <div class="flex justify-between text-[10px]"><span>health</span><span id="stat-hp">100</span></div>
                    <div class="bar-container"><div id="bar-hp" class="bar-fill bg-green-500" style="width: 50%"></div></div>
                    <div class="flex justify-between text-[10px]"><span>speed</span><span id="stat-spd">high</span></div>
                    <div class="bar-container"><div id="bar-spd" class="bar-fill bg-blue-500" style="width: 80%"></div></div>
                </div>

                <div>
                    <p class="text-[10px] font-bold text-gray-400 mb-2 ml-1">weapon</p>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="setWeapon('pulse')" id="wpn-pulse" class="btn-select p-3 rounded-xl text-xs active">pulse</button>
                        <button onclick="setWeapon('beam')" id="wpn-beam" class="btn-select p-3 rounded-xl text-xs">ion beam</button>
                    </div>
                </div>
            </div>

            <button onclick="startGame()" class="w-full bg-[#1d1d1f] text-white py-4 rounded-2xl font-medium hover:opacity-90 active:scale-95 transition-all">
                enter arena
            </button>
        </div>
    </div>

    <!-- hud -->
    <div id="hud" class="fixed top-6 left-6 right-6 z-40 hidden flex justify-between items-start pointer-events-none">
        <div class="hud-item space-y-2">
            <div class="flex justify-between text-[10px]"><span>hp</span><span id="hud-hp-val">100</span></div>
            <div class="bar-container"><div id="hud-hp-bar" class="bar-fill bg-green-500"></div></div>
            <div class="flex justify-between text-[10px]"><span>stamina</span><span id="hud-stm-val">100</span></div>
            <div class="bar-container"><div id="hud-stm-bar" class="bar-fill bg-blue-400"></div></div>
        </div>
        <div class="text-center apple-card px-6 py-2">
            <span id="score-me">0</span> : <span id="score-opp">0</span>
        </div>
        <div class="hud-item text-right">
            <p class="text-[10px] text-gray-400">opponent</p>
            <p id="opp-name" class="text-sm font-medium">connecting...</p>
        </div>
    </div>

    <!-- game over -->
    <div id="game-over" class="fixed inset-0 z-[70] bg-white/95 backdrop-blur-xl hidden flex flex-col items-center justify-center p-8">
        <h2 id="result-text" class="text-5xl font-light tracking-tighter">victory</h2>
        <p class="text-gray-400 mt-4">first to 3 points reached</p>
        <button onclick="location.reload()" class="mt-12 bg-blue-600 text-white px-8 py-3 rounded-2xl">queue again</button>
    </div>

    <canvas id="game-canvas"></canvas>

    <script>
        const SERVER_URL = 'https://gravity-server-shc5.onrender.com';
        const socket = io(SERVER_URL);
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        
        let gameState = 'setup';
        let config = { type: 'scout', weapon: 'pulse' };
        let me = null, opponent = null;
        let particles = [], bullets = [], oppBullets = [];
        let score = { me: 0, opp: 0 };
        let mouse = { x: 0, y: 0 };

        const classConfigs = {
            scout: { hp: 100, speed: 7, def: 20, abilities: ['dash', 'blink', 'clone'] },
            tank: { hp: 200, speed: 4, def: 50, abilities: ['shield', 'stomp', 'fortify'] },
            mage: { hp: 120, speed: 5, def: 30, abilities: ['teleport', 'slow', 'void'] }
        };

        function addToast(msg, err=false) {
            const container = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = `p-3 rounded-xl bg-white/90 border ${err ? 'border-red-200' : 'border-green-200'} text-[10px] w-40 transition-all duration-300`;
            t.innerText = msg;
            container.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
        }

        socket.on('connect', () => { document.getElementById('server-status').classList.add('hidden'); addToast('connected'); });
        socket.on('connect_error', () => addToast('reconnecting...', true));

        function setType(t) {
            config.type = t;
            document.querySelectorAll('[id^="type-"]').forEach(el => el.classList.remove('active'));
            document.getElementById(`type-${t}`).classList.add('active');
            updateStatPreview();
        }

        function setWeapon(w) {
            config.weapon = w;
            document.querySelectorAll('[id^="wpn-"]').forEach(el => el.classList.remove('active'));
            document.getElementById(`wpn-${w}`).classList.add('active');
        }

        function updateStatPreview() {
            const c = classConfigs[config.type];
            document.getElementById('stat-hp').innerText = c.hp;
            document.getElementById('bar-hp').style.width = (c.hp/200)*100 + '%';
            document.getElementById('bar-spd').style.width = (c.speed/8)*100 + '%';
        }

        function startGame() {
            document.getElementById('setup').style.display = 'none';
            document.getElementById('loader')?.classList.remove('hidden');
            socket.emit('join_game', config);
        }

        socket.on('match_found', (data) => {
            document.getElementById('hud').classList.remove('hidden');
            canvas.style.display = 'block';
            resize();
            const myData = data.players.find(p => p.id === socket.id);
            const oppData = data.players.find(p => p.id !== socket.id);
            me = { ...myData, color: '#0071e3', radius: 20, angle: 0 };
            opponent = { ...oppData, color: '#ff3b30', radius: 20, angle: 0 };
            document.getElementById('opp-name').innerText = opponent.type;
            gameState = 'playing';
            requestAnimationFrame(loop);
        });

        socket.on('opponent_sync', d => { if(opponent) Object.assign(opponent, d); });
        socket.on('opponent_fire', d => { oppBullets.push(d); createExplosion(d.x, d.y, opponent.color); });

        function createExplosion(x, y, color) {
            for(let i=0; i<10; i++) particles.push({ x, y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10, life: 1, color });
        }

        function resize() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

        function shoot() {
            if(!me || me.stamina < 10) return;
            const angle = Math.atan2(mouse.y - me.y, mouse.x - me.x);
            const b = { x: me.x, y: me.y, vx: Math.cos(angle)*15, vy: Math.sin(angle)*15, owner: socket.id };
            bullets.push(b);
            me.stamina -= 15;
            socket.emit('fire', b);
        }

        const keys = {};
        window.addEventListener('keydown', e => { keys[e.code] = true; if(e.code === 'Space') shoot(); });
        window.addEventListener('keyup', e => keys[e.code] = false);

        // Mobile Aiming logic
        canvas.addEventListener('touchstart', e => {
            const t = e.touches[0];
            if(t.clientX > window.innerWidth/2) {
                mouse.x = t.clientX; mouse.y = t.clientY; shoot();
            }
        });

        const joystick = { active: false, x: 0, y: 0, curX: 0, curY: 0 };
        canvas.addEventListener('touchstart', e => {
            const t = e.touches[0];
            if(t.clientX < window.innerWidth/2) {
                joystick.active = true; joystick.x = t.clientX; joystick.y = t.clientY; joystick.curX = t.clientX; joystick.curY = t.clientY;
            }
        });
        canvas.addEventListener('touchmove', e => {
            if(!joystick.active) return;
            const t = Array.from(e.touches).find(t => t.clientX < window.innerWidth/2);
            if(t) { joystick.curX = t.clientX; joystick.curY = t.clientY; }
        });
        canvas.addEventListener('touchend', () => joystick.active = false);

        function update() {
            if(gameState !== 'playing') return;
            const conf = classConfigs[me.type];
            
            let dx = 0, dy = 0;
            if(keys['KeyW']) dy--; if(keys['KeyS']) dy++; if(keys['KeyA']) dx--; if(keys['KeyD']) dx++;
            
            if(joystick.active) {
                const jdx = joystick.curX - joystick.x;
                const jdy = joystick.curY - joystick.y;
                const dist = Math.sqrt(jdx*jdx + jdy*jdy);
                if(dist > 5) { dx = jdx/dist; dy = jdy/dist; }
            }

            me.x += dx * conf.speed;
            me.y += dy * conf.speed;
            me.stamina = Math.min(100, me.stamina + 0.5);
            
            me.x = Math.max(20, Math.min(window.innerWidth-20, me.x));
            me.y = Math.max(20, Math.min(window.innerHeight-20, me.y));

            // Collision Check
            oppBullets.forEach((b, i) => {
                const d = Math.sqrt((b.x - me.x)**2 + (b.y - me.y)**2);
                if(d < me.radius) {
                    me.hp -= 10 * (1 - conf.def/100);
                    createExplosion(me.x, me.y, me.color);
                    oppBullets.splice(i, 1);
                }
            });

            if(me.hp <= 0) { score.opp++; resetRound(); }

            socket.emit('sync', { x: me.x, y: me.y, hp: me.hp, stamina: me.stamina });

            bullets.forEach((b, i) => { b.x += b.vx; b.y += b.vy; if(b.x<0||b.x>window.innerWidth) bullets.splice(i, 1); });
            oppBullets.forEach((b, i) => { b.x += b.vx; b.y += b.vy; if(b.x<0||b.x>window.innerWidth) oppBullets.splice(i, 1); });
            particles.forEach((p, i) => { p.x += p.vx; p.y += p.vy; p.life -= 0.02; if(p.life <= 0) particles.splice(i, 1); });

            // UI Update
            document.getElementById('hud-hp-val').innerText = Math.ceil(me.hp);
            document.getElementById('hud-hp-bar').style.width = (me.hp/conf.hp)*100 + '%';
            document.getElementById('hud-stm-bar').style.width = me.stamina + '%';
            document.getElementById('score-me').innerText = score.me;
            document.getElementById('score-opp').innerText = score.opp;

            if(score.me >= 3 || score.opp >= 3) {
                gameState = 'ended';
                document.getElementById('game-over').classList.remove('hidden');
                document.getElementById('result-text').innerText = score.me >= 3 ? 'victory' : 'defeat';
            }
        }

        function resetRound() {
            me.hp = classConfigs[me.type].hp;
            me.x = socket.id === me.id ? 200 : 600;
            me.y = 300;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Grid
            ctx.strokeStyle = '#f0f0f0';
            ctx.lineWidth = 1;
            for(let i=0; i<window.innerWidth; i+=50) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, window.innerHeight); ctx.stroke(); }
            for(let i=0; i<window.innerHeight; i+=50) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(window.innerWidth, i); ctx.stroke(); }

            const drawPlayer = (p) => {
                ctx.save();
                ctx.translate(p.x, p.y);
                // Shadow
                ctx.shadowBlur = 15;
                ctx.shadowColor = 'rgba(0,0,0,0.05)';
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(0, 0, p.radius, 0, Math.PI*2);
                ctx.fill();
                
                // Weapon pointer
                const ang = p.id === socket.id ? Math.atan2(mouse.y - p.y, mouse.x - p.x) : Math.atan2(me.y - p.y, me.x - p.x);
                ctx.rotate(ang);
                ctx.fillStyle = '#1d1d1f';
                ctx.fillRect(10, -2, 25, 4);
                ctx.restore();
            };

            if(me) drawPlayer(me);
            if(opponent) drawPlayer(opponent);

            bullets.concat(oppBullets).forEach(b => {
                ctx.fillStyle = '#1d1d1f';
                ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill();
            });

            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
            });
            ctx.globalAlpha = 1;

            if(joystick.active) {
                ctx.strokeStyle = 'rgba(0,0,0,0.05)';
                ctx.beginPath(); ctx.arc(joystick.x, joystick.y, 40, 0, Math.PI*2); ctx.stroke();
                ctx.fillStyle = 'rgba(0,0,0,0.05)';
                ctx.beginPath(); ctx.arc(joystick.curX, joystick.curY, 15, 0, Math.PI*2); ctx.fill();
            }
        }

        function loop() {
            update();
            draw();
            if(gameState === 'playing') requestAnimationFrame(loop);
        }

        updateStatPreview();
    </script>
</body>
</html>
