<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>orbiter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #010101;
            --fg: #ffffff;
            --accent: #00f2ff;
            --danger: #ff2d55;
            --gold: #ffcc00;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', sans-serif;
            text-transform: lowercase;
            margin: 0;
            padding: 0;
        }

        body, html {
            background-color: var(--bg);
            color: var(--fg);
            overflow: hidden;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        canvas {
            display: block;
            filter: contrast(1.05);
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .hud.active { opacity: 1; }

        .score-display {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: -0.05em;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(1, 1, 1, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .overlay.hidden {
            opacity: 0;
            visibility: hidden;
            transform: scale(1.05);
        }

        .content-box {
            text-align: center;
            pointer-events: auto;
        }

        h1 {
            font-size: 4rem;
            font-weight: 600;
            letter-spacing: -0.08em;
            margin-bottom: 0.5rem;
            background: linear-gradient(to bottom, #fff, #444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn {
            position: relative;
            padding: 1.2rem 3rem;
            border: 1px solid var(--border);
            background: var(--glass);
            color: var(--fg);
            border-radius: 100px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            margin-top: 1rem;
        }

        .btn:hover {
            background: var(--fg);
            color: var(--bg);
            transform: scale(1.05);
        }

        .ldm-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 1.5rem;
            opacity: 0.6;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .ldm-toggle input { display: none; }
        .checkmark {
            width: 18px;
            height: 18px;
            border: 1px solid var(--border);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .ldm-toggle input:checked + .checkmark {
            background: var(--accent);
            border-color: var(--accent);
        }

        .ldm-toggle input:checked + .checkmark::after {
            content: '✓';
            color: #000;
            font-size: 12px;
        }

        .glitch-flash {
            position: absolute;
            inset: 0;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 30;
        }

        @keyframes flash {
            0% { opacity: 0.8; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

<audio id="death-sound" src="failure.mp3"></audio>

<div id="game-container">
    <div id="glitch" class="glitch-flash"></div>
    <canvas id="canvas"></canvas>
    
    <div id="ui-layer">
        <div class="hud" id="hud">
            <div class="score-display" id="score-val">0</div>
            <div style="opacity: 0.4; text-align: right;">
                best: <span id="best-val">0</span><br>
                <span id="rank-val">rank 1</span>
            </div>
        </div>
    </div>

    <div id="start-screen" class="overlay">
        <div class="content-box">
            <h1>orbiter</h1>
            <button class="btn" id="play-button">initiate</button>
            <label class="ldm-toggle">
                <input type="checkbox" id="ldm-checkbox">
                <span class="checkmark"></span>
                low detail mode
            </label>
        </div>
    </div>

    <div id="death-screen" class="overlay hidden">
        <div class="content-box">
            <h1 style="color: var(--danger)">voided</h1>
            <p id="final-score" style="margin-bottom: 2rem;">0</p>
            <button class="btn" id="retry-button">reboot</button>
            <label class="ldm-toggle">
                <input type="checkbox" id="ldm-checkbox-dead">
                <span class="checkmark"></span>
                low detail mode
            </label>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const glitch = document.getElementById('glitch');
    const scoreVal = document.getElementById('score-val');
    const bestVal = document.getElementById('best-val');
    const rankVal = document.getElementById('rank-val');
    const hud = document.getElementById('hud');
    const ldmCheck = document.getElementById('ldm-checkbox');
    const ldmCheckDead = document.getElementById('ldm-checkbox-dead');
    const deathSound = document.getElementById('death-sound');
    
    let width, height, dpr, ldm = false;
    let score = 0;
    let best = localStorage.getItem('orbiter_v4_best') || 0;
    bestVal.textContent = best;

    let particles = [];
    let enemies = [];
    let shocks = [];
    let activeRings = 1;
    let canRespawn = true;

    let playerOrbits = [
        { angle: 0, dir: 1, trail: [], baseRadius: 0.18 },
        { angle: Math.PI, dir: -1, trail: [], baseRadius: 0.28 },
        { angle: Math.PI/2, dir: 1, trail: [], baseRadius: 0.38 }
    ];

    let gameState = 'menu';
    let frame = 0;
    let spawnRate = 80;

    // Sync Checkboxes
    [ldmCheck, ldmCheckDead].forEach(c => {
        c.addEventListener('change', (e) => {
            ldm = e.target.checked;
            ldmCheck.checked = ldm;
            ldmCheckDead.checked = ldm;
        });
    });

    function resize() {
        dpr = window.devicePixelRatio || 1;
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.scale(dpr, dpr);
    }

    window.addEventListener('resize', resize);
    resize();

    class Shockwave {
        constructor(x, y, color) {
            this.x = x; this.y = y; this.r = 0; this.opacity = 1; this.color = color;
        }
        update() { this.r += 4; this.opacity -= 0.03; }
        draw() {
            if (ldm || this.opacity <= 0) return;
            ctx.save();
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
            ctx.strokeStyle = this.color;
            ctx.globalAlpha = this.opacity;
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.restore();
        }
    }

    class Enemy {
        constructor(type = 'basic') {
            this.type = type;
            this.spawnTime = Date.now();
            this.lifespan = 3000 + Math.random() * 4000; 
            this.color = type === 'seeker' ? '#ff8800' : (type === 'gold' ? '#ffcc00' : '#ff2d55');
            this.opacity = 1;
            this.kill = false;
            this.size = type === 'gold' ? 8 : 12;

            const angle = Math.random() * Math.PI * 2;
            const dist = Math.max(width, height) * 0.7;
            this.x = width/2 + Math.cos(angle) * dist;
            this.y = height/2 + Math.sin(angle) * dist;

            let tx = width/2, ty = height/2;

            if (type === 'basic') {
                const targetOrbit = playerOrbits[Math.floor(Math.random() * activeRings)];
                const r = Math.min(width, height) * targetOrbit.baseRadius;
                const predictedAngle = targetOrbit.angle + (targetOrbit.dir * 0.045 * 60);
                tx = width/2 + Math.cos(predictedAngle) * r;
                ty = height/2 + Math.sin(predictedAngle) * r;
                this.speed = 2.5 + (score / 100);
            } else if (type === 'seeker') {
                this.speed = 1.4 + (score / 150);
            } else {
                this.speed = 4.5;
            }

            const moveAngle = Math.atan2(ty - this.y, tx - this.x);
            this.vx = Math.cos(moveAngle) * this.speed;
            this.vy = Math.sin(moveAngle) * this.speed;
        }

        update() {
            if (this.type === 'seeker') {
                const age = Date.now() - this.spawnTime;
                if (age > this.lifespan) {
                    this.opacity -= 0.05;
                    if (this.opacity <= 0) this.kill = true;
                }
                const targetOrbit = playerOrbits[0];
                const r = Math.min(width, height) * targetOrbit.baseRadius;
                const tx = width/2 + Math.cos(targetOrbit.angle) * r;
                const ty = height/2 + Math.sin(targetOrbit.angle) * r;
                const angle = Math.atan2(ty - this.y, tx - this.x);
                this.vx += Math.cos(angle) * 0.1;
                this.vy += Math.sin(angle) * 0.1;
                const s = Math.hypot(this.vx, this.vy);
                if (s > this.speed) { this.vx = (this.vx/s)*this.speed; this.vy = (this.vy/s)*this.speed; }
            }

            this.x += this.vx;
            this.y += this.vy;

            for(let i=0; i<activeRings; i++) {
                const r = Math.min(width, height) * playerOrbits[i].baseRadius;
                const px = width/2 + Math.cos(playerOrbits[i].angle) * r;
                const py = height/2 + Math.sin(playerOrbits[i].angle) * r;
                if (Math.hypot(this.x - px, this.y - py) < this.size + 8) {
                    if (this.type === 'gold') { addScore(5, this.x, this.y); this.kill = true; }
                    else if (this.opacity > 0.5) endGame();
                }
            }

            if (Math.hypot(this.x - width/2, this.y - height/2) > width * 1.5) this.kill = true;
        }

        draw() {
            ctx.save();
            ctx.globalAlpha = this.opacity;
            if (!ldm) {
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
            }
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
        }
    }

    function addScore(n, x, y) {
        score += n;
        scoreVal.textContent = score;
        if (!ldm && x && y) shocks.push(new Shockwave(x, y, '#ffcc00'));
        if (score >= 100) activeRings = 3; else if (score >= 50) activeRings = 2;
        rankVal.textContent = `rank ${activeRings}`;
    }

    function initiate() {
        if (!canRespawn && gameState === 'dead') return;
        
        gameState = 'playing';
        score = 0; 
        spawnRate = 80;
        activeRings = 1; 
        enemies = []; 
        particles = []; 
        shocks = [];
        playerOrbits.forEach(o => o.trail = []);
        scoreVal.textContent = "0";
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('death-screen').classList.add('hidden');
        hud.classList.add('active');
    }

    function endGame() {
        if (gameState === 'dead') return;
        gameState = 'dead';

        if (Math.random() < 0.33) {
            localStorage.setItem('isafailure', 'true');
            deathSound.currentTime = 0;
            deathSound.play().catch(() => {});
            
            canRespawn = false;
            const retryBtn = document.getElementById('retry-button');
            retryBtn.style.opacity = "0.5";
            retryBtn.textContent = "recovering...";

            deathSound.onended = () => {
                localStorage.setItem('isafailure', 'false');
                canRespawn = true;
                retryBtn.style.opacity = "1";
                retryBtn.textContent = "reboot";
            };
        } else {
            canRespawn = true;
        }

        if (!ldm) {
            glitch.style.animation = 'flash 0.3s forwards';
            setTimeout(() => glitch.style.animation = '', 400);
        }
        if (score > best) { best = score; localStorage.setItem('orbiter_v4_best', best); bestVal.textContent = best; }
        document.getElementById('final-score').textContent = `score: ${score}`;
        document.getElementById('death-screen').classList.remove('hidden');
        hud.classList.remove('active');
    }

    function input() {
        if (gameState === 'playing') {
            playerOrbits.forEach((o, i) => { if(i < activeRings) o.dir *= -1; });
        }
    }

    document.getElementById('play-button').onclick = (e) => { e.stopPropagation(); initiate(); };
    
    document.getElementById('retry-button').onclick = (e) => { 
        e.stopPropagation();
        const btn = document.getElementById('retry-button');
        if (!canRespawn && btn.textContent === "tap to begin") {
            deathSound.play().then(() => {
                btn.textContent = "recovering...";
                btn.style.opacity = "0.5";
                deathSound.onended = () => {
                    localStorage.setItem('isafailure', 'false');
                    canRespawn = true;
                    btn.style.opacity = "1";
                    btn.textContent = "reboot";
                };
            });
        } else if (canRespawn) {
            initiate(); 
        }
    };

    window.addEventListener('mousedown', input);
    window.addEventListener('touchstart', (e) => { if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT' && !e.target.classList.contains('ldm-toggle')) { e.preventDefault(); input(); } }, { passive: false });

    function loop() {
        ctx.fillStyle = ldm ? '#010101' : 'rgba(1,1,1,0.25)';
        ctx.fillRect(0, 0, width, height);
        const baseSize = Math.min(width, height);

        for(let i=0; i<activeRings; i++) {
            ctx.beginPath();
            ctx.arc(width/2, height/2, baseSize * playerOrbits[i].baseRadius, 0, Math.PI*2);
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.stroke();
        }

        if (gameState === 'playing') {
            frame++;
            playerOrbits.forEach((o, i) => {
                if(i < activeRings) {
                    o.angle += 0.045 * o.dir;
                    if (!ldm) {
                        o.trail.push({ x: width/2 + Math.cos(o.angle) * (baseSize * o.baseRadius), y: height/2 + Math.sin(o.angle) * (baseSize * o.baseRadius) });
                        if (o.trail.length > 15) o.trail.shift();
                    }
                }
            });
            if (frame % Math.floor(spawnRate) === 0) {
                let type = 'basic';
                const r = Math.random();
                if (r > 0.9) type = 'gold'; else if (r > 0.7 && score > 30) type = 'seeker';
                enemies.push(new Enemy(type));
                if(spawnRate > 25) spawnRate -= 0.2;
                addScore(1);
            }
        }

        shocks.forEach((s, i) => { s.update(); s.draw(); if(s.opacity <= 0) shocks.splice(i, 1); });

        if (gameState !== 'dead') {
            playerOrbits.forEach((o, idx) => {
                if (idx >= activeRings) return;
                if (!ldm) {
                    o.trail.forEach((t, i) => {
                        ctx.globalAlpha = i / o.trail.length;
                        ctx.fillStyle = varColor('--accent');
                        ctx.beginPath(); ctx.arc(t.x, t.y, (i/15)*6, 0, Math.PI*2); ctx.fill();
                    });
                }
                ctx.globalAlpha = 1;
                const px = width/2 + Math.cos(o.angle) * (baseSize * o.baseRadius);
                const py = height/2 + Math.sin(o.angle) * (baseSize * o.baseRadius);
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(px, py, 8, 0, Math.PI*2); ctx.fill();
            });
        }

        enemies.forEach((e, i) => { e.update(); e.draw(); if(e.kill) enemies.splice(i, 1); });
        requestAnimationFrame(loop);
    }

    function varColor(name) { return getComputedStyle(document.documentElement).getPropertyValue(name); }

    if (localStorage.getItem('isafailure') === 'true') {
        gameState = 'dead';
        canRespawn = false;
        document.getElementById('death-screen').classList.remove('hidden');
        document.getElementById('start-screen').classList.add('hidden');
        hud.classList.remove('active');
        const retryBtn = document.getElementById('retry-button');
        retryBtn.textContent = "tap to begin";
    }

    loop();
</script>
</body>
</html>
