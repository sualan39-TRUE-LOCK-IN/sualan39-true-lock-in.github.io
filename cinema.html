<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>8K Procedural Clouds & Sky</title>
    <style>
        :root {
            --glass: rgba(20, 20, 25, 0.7);
            --glass-heavy: rgba(10, 10, 15, 0.85);
            --border: rgba(255, 255, 255, 0.15);
            --apple-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #000; 
            font-family: var(--apple-font);
            color: white;
            -webkit-font-smoothing: antialiased;
        }
        canvas { display: block; touch-action: none; }

        /* UI Toggle Button (Small Square) */
        #ui-toggle {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        #ui-toggle:hover {
            background: rgba(40, 40, 45, 0.8);
            transform: scale(1.05);
        }
        #ui-toggle svg {
            width: 22px;
            height: 22px;
            fill: white;
            opacity: 0.9;
            transition: transform 0.5s ease;
        }
        #ui-toggle.active svg {
            transform: rotate(90deg);
        }

        /* Main Control Panel */
        #interface {
            position: absolute;
            bottom: 95px;
            right: 30px;
            width: 280px;
            background: var(--glass-heavy);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            user-select: none;
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px) scale(0.95);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 99;
        }
        #interface.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }

        .control-group { margin-bottom: 22px; }
        .control-group:last-child { margin-bottom: 0; }

        label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.02em;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        input[type=range] {
            width: 100%;
            appearance: none;
            background: rgba(255,255,255,0.1);
            height: 4px;
            border-radius: 10px;
            outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            appearance: none;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            border: none;
        }

        /* Capture Button */
        #capture-btn {
            width: 100%;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-family: var(--apple-font);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            transition: all 0.2s ease;
        }
        #capture-btn:active {
            transform: scale(0.97);
            opacity: 0.8;
        }

        .header {
            position: absolute;
            top: 40px;
            left: 40px;
            pointer-events: none;
        }
        .header h1 {
            font-weight: 400;
            font-size: 13px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin: 0;
            opacity: 0.3;
        }

        /* Toast Message */
        #toast {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(255,255,255,0.9);
            color: black;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 1000;
        }
        #toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div class="header">
        <h1>Atmosphere v2.1</h1>
    </div>

    <div id="toast">8K Capture Saved</div>

    <div id="ui-toggle">
        <svg viewBox="0 0 24 24">
            <path d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.35 19.43,11.03L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.96 19.05,5.05L16.56,6.05C16.04,5.66 15.47,5.32 14.87,5.07L14.49,2.42C14.46,2.18 14.25,2 14,2H10C9.75,2 9.54,2.18 9.51,2.42L9.13,5.07C8.53,5.32 7.96,5.66 7.44,6.05L4.95,5.05C4.73,4.96 4.46,5.05 4.34,5.27L2.34,8.73C2.22,8.95 2.27,9.22 2.46,9.37L4.57,11.03C4.53,11.35 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.22,15.05 2.34,15.27L4.34,18.73C4.46,18.95 4.73,19.04 4.95,18.95L7.44,17.95C7.96,18.34 8.53,18.68 9.13,18.93L9.51,21.58C9.54,21.82 9.75,22 10,22H14C14.25,22 14.46,21.82 14.49,21.58L14.87,18.93C15.47,18.68 16.04,18.34 16.56,17.95L19.05,18.95C19.27,19.04 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z" />
        </svg>
    </div>

    <div id="interface">
        <div class="control-group">
            <label>Elevation <span id="val-elev">5°</span></label>
            <input type="range" id="elevation" min="-5" max="90" step="0.1" value="5">
        </div>
        <div class="control-group">
            <label>Density <span id="val-dense">0.45</span></label>
            <input type="range" id="density" min="0" max="1" step="0.01" value="0.45">
        </div>
        <div class="control-group">
            <label>Motion <span id="val-speed">1.0</span></label>
            <input type="range" id="speed" min="0" max="5" step="0.1" value="1.0">
        </div>
        
        <button id="capture-btn">
            <svg style="width:18px;height:18px" viewBox="0 0 24 24">
                <path fill="currentColor" d="M4,4H7L9,2H15L17,4H20A2,2 0 0,1 22,6V18A2,2 0 0,1 20,20H4A2,2 0 0,1 2,18V6A2,2 0 0,1 4,4M12,7A5,5 0 0,0 7,12A5,5 0 0,0 12,17A5,5 0 0,0 17,12A5,5 0 0,0 12,7M12,9A3,3 0 0,1 15,12A3,3 0 0,1 12,15A3,3 0 0,1 9,12A3,3 0 0,1 12,9Z" />
            </svg>
            Capture 8K View
        </button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { Sky } from 'three/addons/objects/Sky.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let camera, scene, renderer, sky, sun, clouds, controls;
        let clock = new THREE.Clock();

        const cloudShader = {
            uniforms: {
                uTime: { value: 0 },
                uSunPos: { value: new THREE.Vector3() },
                uDensity: { value: 0.45 },
                uFogColor: { value: new THREE.Color(0.4, 0.6, 0.8) }
            },
            vertexShader: `
                varying vec2 vUv;
                varying vec3 vWorldPosition;
                varying float vElevation;
                void main() {
                    vUv = uv;
                    vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                    vWorldPosition = worldPosition.xyz;
                    vElevation = normalize(worldPosition.xyz).y;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float uTime;
                uniform vec3 uSunPos;
                uniform float uDensity;
                uniform vec3 uFogColor;
                varying vec2 vUv;
                varying vec3 vWorldPosition;
                varying float vElevation;

                float hash(float n) { return fract(sin(n) * 43758.5453123); }
                float noise(vec3 x) {
                    vec3 p = floor(x);
                    vec3 f = fract(x);
                    f = f*f*(3.0-2.0*f);
                    float n = p.x + p.y*57.0 + 113.0*p.z;
                    return mix(mix(mix(hash(n+0.0), hash(n+1.0),f.x),
                               mix(hash(n+57.0), hash(n+58.0),f.x),f.y),
                           mix(mix(hash(n+113.0),hash(n+114.0),f.x),
                               mix(hash(n+170.0),hash(n+171.0),f.x),f.y),f.z);
                }
                float fbm(vec3 p) {
                    float f = 0.0; float w = 0.5;
                    for (int i = 0; i < 6; i++) {
                        f += w * noise(p); p *= 2.15; w *= 0.47;
                    }
                    return f;
                }
                void main() {
                    vec3 dir = normalize(vWorldPosition);
                    vec2 planeCoord = dir.xz / (dir.y + 0.08); 
                    vec3 coord = vec3(planeCoord * 3.2, uTime * 0.012);
                    float baseNoise = fbm(coord);
                    float erosion = fbm(coord * 4.5 + uTime * 0.025);
                    float shape = baseNoise * 0.85 + erosion * 0.15;
                    float cloudAlpha = smoothstep(1.0 - uDensity, 1.15, shape);
                    vec3 sunDir = normalize(uSunPos);
                    float sunDot = dot(sunDir, dir);
                    float thickness = smoothstep(0.25, 0.75, shape);
                    vec3 shadowCol = vec3(0.12, 0.18, 0.28);
                    vec3 lightCol = vec3(1.0, 0.98, 0.94);
                    float sunset = smoothstep(0.22, -0.18, sunDir.y);
                    lightCol = mix(lightCol, vec3(1.0, 0.52, 0.15), sunset);
                    shadowCol = mix(shadowCol, vec3(0.14, 0.07, 0.09), sunset);
                    float rim = pow(max(sunDot, 0.0), 18.0) * 1.8;
                    float sunOcclusion = smoothstep(0.95, 1.0, sunDot) * 0.6 * thickness;
                    vec3 finalCol = mix(shadowCol, lightCol, (1.0 - thickness * 0.75) + rim);
                    finalCol *= (1.0 - sunOcclusion);
                    float hFade = smoothstep(0.005, 0.15, vElevation);
                    float sunDamp = 1.0 - pow(max(sunDot, 0.0), 48.0) * 0.35;
                    gl_FragColor = vec4(finalCol, cloudAlpha * hFade * sunDamp);
                }
            `
        };

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 100, 2000000);
            camera.position.set(0, 100, 1000);

            try {
                renderer = new THREE.WebGLRenderer({ 
                    antialias: true, 
                    preserveDrawingBuffer: true,
                    powerPreference: "high-performance"
                });
                
                // Ensure WebGL context exists before continuing
                if (!renderer.getContext()) {
                    throw new Error("WebGL Context Error");
                }
            } catch (e) {
                console.warn("Retrying with minimal renderer settings...");
                renderer = new THREE.WebGLRenderer({ 
                    preserveDrawingBuffer: true 
                });
            }

            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 0.4;
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enableZoom = false;

            sky = new Sky();
            sky.scale.setScalar(450000);
            scene.add(sky);

            const skyUniforms = sky.material.uniforms;
            skyUniforms['turbidity'].value = 10;
            skyUniforms['rayleigh'].value = 2.5;
            skyUniforms['mieCoefficient'].value = 0.005;
            skyUniforms['mieDirectionalG'].value = 0.85;

            sun = new THREE.Vector3();
            const cloudGeo = new THREE.SphereGeometry(60000, 128, 64, 0, Math.PI * 2, 0, Math.PI / 2.05);
            const cloudMat = new THREE.ShaderMaterial({
                uniforms: THREE.UniformsUtils.clone(cloudShader.uniforms),
                vertexShader: cloudShader.vertexShader,
                fragmentShader: cloudShader.fragmentShader,
                transparent: true,
                side: THREE.BackSide,
                depthWrite: false
            });
            clouds = new THREE.Mesh(cloudGeo, cloudMat);
            scene.add(clouds);

            setupUI();
        }

        function setupUI() {
            const elv = document.getElementById('elevation');
            const den = document.getElementById('density');
            const spd = document.getElementById('speed');
            const uiToggle = document.getElementById('ui-toggle');
            const interfaceBox = document.getElementById('interface');
            const captureBtn = document.getElementById('capture-btn');

            uiToggle.addEventListener('click', () => {
                uiToggle.classList.toggle('active');
                interfaceBox.classList.toggle('visible');
            });

            const update = () => {
                const elev = parseFloat(elv.value);
                document.getElementById('val-elev').innerText = `${elev.toFixed(1)}°`;
                document.getElementById('val-dense').innerText = den.value;
                document.getElementById('val-speed').innerText = spd.value;

                const phi = THREE.MathUtils.degToRad(90 - elev);
                const theta = THREE.MathUtils.degToRad(180);
                sun.setFromSphericalCoords(1, phi, theta);

                sky.material.uniforms['sunPosition'].value.copy(sun);
                clouds.material.uniforms['uSunPos'].value.copy(sun);
                clouds.material.uniforms['uDensity'].value = parseFloat(den.value);
                renderer.toneMappingExposure = THREE.MathUtils.lerp(0.5, 0.25, Math.max(0, elev / 90));
            };

            [elv, den, spd].forEach(el => el.addEventListener('input', update));
            captureBtn.addEventListener('click', capture8K);
            window.addEventListener('resize', onWindowResize);
            update();
        }

        function capture8K() {
            const toast = document.getElementById('toast');
            const width = 7680;
            const height = 4320;
            
            // Save original state
            const originalSize = new THREE.Vector2();
            renderer.getSize(originalSize);
            const originalAspect = camera.aspect;

            // Prepare renderer for high-res output
            renderer.setSize(width, height, false);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();

            // Render high-res frame immediately
            renderer.render(scene, camera);

            try {
                const dataUrl = renderer.domElement.toDataURL('image/png');
                const link = document.createElement('a');
                link.download = `Atmosphere_8K_${Date.now()}.png`;
                link.href = dataUrl;
                link.click();
                
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 3000);
            } catch (e) {
                console.error("Capture failed:", e);
            }

            // Restore original state immediately after download trigger
            renderer.setSize(originalSize.x, originalSize.y);
            camera.aspect = originalAspect;
            camera.updateProjectionMatrix();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const speed = parseFloat(document.getElementById('speed').value);
            clouds.material.uniforms['uTime'].value += delta * speed;
            controls.update();
            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
