<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Atmosphere Procedural Sky</title>
    <style>
        :root {
            --glass: rgba(20, 20, 25, 0.7);
            --glass-heavy: rgba(10, 10, 15, 0.85);
            --border: rgba(255, 255, 255, 0.15);
            --apple-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #000; 
            font-family: var(--apple-font);
            color: white;
            -webkit-font-smoothing: antialiased;
        }
        canvas { display: block; touch-action: none; }

        #ui-toggle {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
        }
        #ui-toggle svg { width: 22px; height: 22px; fill: white; transition: transform 0.5s ease; }
        #ui-toggle.active svg { transform: rotate(90deg); }

        #interface {
            position: absolute;
            bottom: 95px;
            right: 30px;
            width: 280px;
            background: var(--glass-heavy);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px) scale(0.95);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 99;
        }
        #interface.visible { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }

        .control-group { margin-bottom: 22px; }
        label { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 12px; opacity: 0.5; }
        input[type=range] { width: 100%; appearance: none; background: rgba(255,255,255,0.1); height: 4px; border-radius: 10px; }
        input[type=range]::-webkit-slider-thumb { appearance: none; width: 20px; height: 20px; background: #fff; border-radius: 50%; cursor: pointer; }

        #capture-btn {
            width: 100%;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        #capture-btn:disabled { opacity: 0.5; cursor: wait; }

        #toast {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: white;
            color: black;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            transition: transform 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        #toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div id="toast">Generating Capture...</div>
    <div id="ui-toggle">
        <svg viewBox="0 0 24 24"><path d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.35 19.43,11.03L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.96 19.05,5.05L16.56,6.05C16.04,5.66 15.47,5.32 14.87,5.07L14.49,2.42C14.46,2.18 14.25,2 14,2H10C9.75,2 9.54,2.18 9.51,2.42L9.13,5.07C8.53,5.32 7.96,5.66 7.44,6.05L4.95,5.05C4.73,4.96 4.46,5.05 4.34,5.27L2.34,8.73C2.22,8.95 2.27,9.22 2.46,9.37L4.57,11.03C4.53,11.35 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.22,15.05 2.34,15.27L4.34,18.73C4.46,18.95 4.73,19.04 4.95,18.95L7.44,17.95C7.96,18.34 8.53,18.68 9.13,18.93L9.51,21.58C9.54,21.82 9.75,22 10,22H14C14.25,22 14.46,21.82 14.49,21.58L14.87,18.93C15.47,18.68 16.04,18.34 16.56,17.95L19.05,18.95C19.27,19.04 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z"/></svg>
    </div>

    <div id="interface">
        <div class="control-group">
            <label>Elevation <span id="val-elev">5°</span></label>
            <input type="range" id="elevation" min="-5" max="90" step="0.1" value="5">
        </div>
        <div class="control-group">
            <label>Density <span id="val-dense">0.45</span></label>
            <input type="range" id="density" min="0" max="1" step="0.01" value="0.45">
        </div>
        <div class="control-group">
            <label>Motion <span id="val-speed">1.0</span></label>
            <input type="range" id="speed" min="0" max="5" step="0.1" value="1.0">
        </div>
        <button id="capture-btn">Capture High-Res</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.min.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { Sky } from 'three/addons/objects/Sky.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let camera, scene, renderer, sky, sun, clouds, controls;
        let clock = new THREE.Clock();

        const cloudShader = {
            uniforms: { uTime: { value: 0 }, uSunPos: { value: new THREE.Vector3() }, uDensity: { value: 0.45 } },
            vertexShader: `
                varying vec3 vWorldPosition;
                varying float vElevation;
                void main() {
                    vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                    vWorldPosition = worldPosition.xyz;
                    vElevation = normalize(worldPosition.xyz).y;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float uTime;
                uniform vec3 uSunPos;
                uniform float uDensity;
                varying vec3 vWorldPosition;
                varying float vElevation;

                float hash(float n) { return fract(sin(n) * 43758.5453123); }
                float noise(vec3 x) {
                    vec3 p = floor(x); vec3 f = fract(x);
                    f = f*f*(3.0-2.0*f);
                    float n = p.x + p.y*57.0 + 113.0*p.z;
                    return mix(mix(mix(hash(n+0.0), hash(n+1.0),f.x), mix(hash(n+57.0), hash(n+58.0),f.x),f.y),
                           mix(mix(hash(n+113.0),hash(n+114.0),f.x), mix(hash(n+170.0),hash(n+171.0),f.x),f.y),f.z);
                }
                float fbm(vec3 p) {
                    float f = 0.0; float w = 0.5;
                    for (int i = 0; i < 6; i++) { f += w * noise(p); p *= 2.15; w *= 0.47; }
                    return f;
                }
                void main() {
                    vec3 dir = normalize(vWorldPosition);
                    vec2 planeCoord = dir.xz / (max(abs(dir.y), 0.001)); 
                    vec3 coord = vec3(planeCoord * 2.0, uTime * 0.012);
                    float baseNoise = fbm(coord);
                    float erosion = fbm(coord * 4.5 + uTime * 0.025);
                    float shape = baseNoise * 0.85 + erosion * 0.15;
                    float cloudAlpha = smoothstep(1.0 - uDensity, 1.15, shape);
                    vec3 sunDir = normalize(uSunPos);
                    float sunDot = dot(sunDir, dir);
                    float thickness = smoothstep(0.25, 0.75, shape);
                    vec3 shadowCol = mix(vec3(0.12, 0.18, 0.28), vec3(0.14, 0.07, 0.09), smoothstep(0.22, -0.18, sunDir.y));
                    vec3 lightCol = mix(vec3(1.0, 0.98, 0.94), vec3(1.0, 0.52, 0.15), smoothstep(0.22, -0.18, sunDir.y));
                    float rim = pow(max(sunDot, 0.0), 18.0) * 1.8;
                    vec3 finalCol = mix(shadowCol, lightCol, (1.0 - thickness * 0.75) + rim);
                    float hFade = smoothstep(0.005, 0.15, vElevation);
                    gl_FragColor = vec4(finalCol, cloudAlpha * hFade);
                }
            `
        };

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 100, 2000000);
            camera.position.set(0, 100, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 0.5;
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.enableZoom = false;

            sky = new Sky();
            sky.scale.setScalar(450000);
            scene.add(sky);

            sun = new THREE.Vector3();
            const cloudMat = new THREE.ShaderMaterial({
                uniforms: THREE.UniformsUtils.clone(cloudShader.uniforms),
                vertexShader: cloudShader.vertexShader,
                fragmentShader: cloudShader.fragmentShader,
                transparent: true, side: THREE.BackSide, depthWrite: false
            });
            clouds = new THREE.Mesh(new THREE.SphereGeometry(60000, 128, 64, 0, Math.PI * 2, 0, Math.PI / 2.05), cloudMat);
            scene.add(clouds);

            setupUI();
            animate();
        }

        function setupUI() {
            const elv = document.getElementById('elevation'), den = document.getElementById('density'), spd = document.getElementById('speed');
            const toggle = document.getElementById('ui-toggle'), box = document.getElementById('interface'), btn = document.getElementById('capture-btn');

            toggle.onclick = () => { toggle.classList.toggle('active'); box.classList.toggle('visible'); };

            const update = () => {
                const elev = parseFloat(elv.value);
                document.getElementById('val-elev').innerText = `${elev.toFixed(1)}°`;
                document.getElementById('val-dense').innerText = den.value;
                document.getElementById('val-speed').innerText = spd.value;
                const phi = THREE.MathUtils.degToRad(90 - elev);
                sun.setFromSphericalCoords(1, phi, THREE.MathUtils.degToRad(180));
                sky.material.uniforms['sunPosition'].value.copy(sun);
                clouds.material.uniforms['uSunPos'].value.copy(sun);
                clouds.material.uniforms['uDensity'].value = parseFloat(den.value);
            };

            [elv, den, spd].forEach(el => el.oninput = update);
            btn.onclick = capture;
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            update();
        }

        async function capture() {
            const btn = document.getElementById('capture-btn');
            const toast = document.getElementById('toast');
            btn.disabled = true;
            toast.innerText = "Processing High-Res...";
            toast.classList.add('show');

            const width = 2560;
            const height = 1440;

            // Use a RenderTarget to avoid resizing the visible canvas
            const renderTarget = new THREE.WebGLRenderTarget(width, height, {
                minFilter: THREE.LinearFilter,
                magFilter: THREE.LinearFilter,
                format: THREE.RGBAFormat,
                type: THREE.UnsignedByteType
            });

            // Swap to off-screen buffer
            const originalAspect = camera.aspect;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();

            renderer.setRenderTarget(renderTarget);
            renderer.render(scene, camera);

            // Create an offscreen canvas to hold the pixels
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const context = canvas.getContext('2d');

            // Read pixels from GPU
            const pixels = new Uint8Array(width * height * 4);
            renderer.readRenderTargetPixels(renderTarget, 0, 0, width, height, pixels);

            // Flip pixels vertically (WebGL is bottom-to-top, Canvas is top-to-bottom)
            const imageData = context.createImageData(width, height);
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const i = (y * width + x) * 4;
                    const j = ((height - 1 - y) * width + x) * 4;
                    imageData.data[i] = pixels[j];
                    imageData.data[i+1] = pixels[j+1];
                    imageData.data[i+2] = pixels[j+2];
                    imageData.data[i+3] = pixels[j+3];
                }
            }
            context.putImageData(imageData, 0, 0);

            // Trigger Download
            const dataUrl = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = `Atmosphere_${Date.now()}.png`;
            link.href = dataUrl;
            link.click();

            // Cleanup
            renderer.setRenderTarget(null);
            renderTarget.dispose();
            camera.aspect = originalAspect;
            camera.updateProjectionMatrix();
            
            toast.innerText = "Capture Saved!";
            setTimeout(() => {
                toast.classList.remove('show');
                btn.disabled = false;
            }, 3000);
        }

        function animate() {
            requestAnimationFrame(animate);
            const speed = parseFloat(document.getElementById('speed').value);
            clouds.material.uniforms['uTime'].value += clock.getDelta() * speed;
            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
