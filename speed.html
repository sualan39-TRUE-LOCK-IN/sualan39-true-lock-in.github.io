<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Oracle V3 | Semantic Triangulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@300;500;700&display=swap');
        
        :root {
            --bg: #050505;
            --card: #0f0f12;
            --accent: #10b981;
        }

        body { 
            font-family: 'Space Grotesk', sans-serif; 
            background-color: var(--bg); 
            color: #fafafa;
            overflow-x: hidden;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }
        
        .glass { 
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .category-pill {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .active-category {
            background: var(--accent);
            color: black;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }

        input:focus {
            border-color: var(--accent) !important;
            box-shadow: 0 0 0 1px var(--accent);
        }

        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(16, 185, 129, 0.1), transparent);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-2xl space-y-6">
        <header class="text-center space-y-2">
            <h1 class="text-5xl font-black tracking-tighter text-white">ORACLE <span class="text-emerald-500">V3</span></h1>
            <div class="flex justify-center gap-4 text-[10px] font-bold uppercase tracking-[0.3em] text-zinc-500">
                <span>Deterministic</span>
                <span>•</span>
                <span>US-English Only</span>
                <span>•</span>
                <span>Threaded Logic</span>
            </div>
        </header>

        <!-- Main Workspace -->
        <div class="glass rounded-[2.5rem] p-8 space-y-8 relative overflow-hidden">
            <div id="loadingOverlay" class="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden">
                <div class="text-center space-y-4">
                    <div class="w-12 h-12 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                    <p class="text-emerald-500 mono text-xs animate-pulse">TRIANGULATING CORES...</p>
                </div>
            </div>

            <!-- Input Row -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="md:col-span-2">
                    <label class="text-[10px] uppercase font-black text-zinc-500 ml-4 mb-2 block">Initial Coordinates</label>
                    <div class="flex gap-2">
                        <input id="wordInput" type="text" placeholder="WORD" 
                            class="w-full bg-zinc-900/50 border-zinc-800 border rounded-2xl px-6 py-4 focus:outline-none uppercase font-bold text-sm transition-all">
                        <input id="rankInput" type="number" placeholder="RANK" 
                            class="w-32 bg-zinc-900/50 border-zinc-800 border rounded-2xl px-4 py-4 focus:outline-none font-mono text-center">
                    </div>
                </div>
                <div class="flex items-end">
                    <button id="addBtn" onclick="handleAddEntry()" 
                        class="w-full bg-white text-black h-[58px] rounded-2xl font-black uppercase text-xs hover:bg-emerald-400 transition-all active:scale-95">
                        Inject Data
                    </button>
                </div>
            </div>

            <!-- Active Hints -->
            <div id="hintContainer" class="flex flex-wrap gap-2 empty:hidden"></div>

            <!-- Focus Categories (Automatic) -->
            <div id="categoryBox" class="hidden space-y-3">
                <span class="text-[10px] uppercase font-black text-zinc-500 ml-4 block">Detected Semantic Domains</span>
                <div id="categoryList" class="flex flex-wrap gap-2"></div>
            </div>

            <!-- Primary Prediction -->
            <div id="predictionDisplay" class="border-t border-zinc-800 pt-8 text-center hidden">
                <div class="mb-6">
                    <span class="text-[10px] uppercase font-black tracking-widest text-emerald-500">Optimal Solution Found</span>
                    <h2 id="topGuess" class="text-7xl font-black tracking-tighter text-white uppercase mt-2">---</h2>
                </div>

                <!-- Feedback Loop -->
                <div class="max-w-sm mx-auto bg-zinc-900/30 p-6 rounded-[2rem] border border-zinc-800">
                    <p class="text-xs text-zinc-400 mb-4">Submit <span class="text-white font-bold italic">Contexto Rank</span> for this guess:</p>
                    <div class="flex gap-2">
                        <input id="feedbackRank" type="number" placeholder="RANK" 
                            class="flex-grow bg-black border-zinc-800 border rounded-xl px-4 py-3 focus:outline-none font-mono text-center">
                        <button onclick="handleFeedback()" class="bg-emerald-500 hover:bg-emerald-400 text-black px-6 rounded-xl font-bold text-xs uppercase">Submit</button>
                        <button onclick="discardGuess()" class="bg-zinc-800 hover:bg-red-500/20 hover:text-red-500 text-zinc-500 p-3 rounded-xl transition-all">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <button onclick="reset()" class="w-full text-zinc-700 hover:text-zinc-500 text-[10px] uppercase font-black tracking-[0.5em] py-4 transition-colors">Clear Neural Buffer</button>
    </div>

    <script>
        let entries = [];
        let currentPrediction = "";
        
        // --- US-ENGLISH FILTER LIST ---
        const britishToAmerican = {
            "colour": "color", "flavour": "flavor", "humour": "humor", "labour": "labor", "neighbour": "neighbor",
            "centre": "center", "theatre": "theater", "metre": "meter", "organise": "organize", "realise": "realize",
            "travelling": "traveling", "defence": "defense", "offence": "offense", "licence": "license"
        };

        // --- KEY LISTENERS ---
        document.getElementById('wordInput').addEventListener('keypress', e => e.key === 'Enter' && document.getElementById('rankInput').focus());
        document.getElementById('rankInput').addEventListener('keypress', e => e.key === 'Enter' && handleAddEntry());
        document.getElementById('feedbackRank').addEventListener('keypress', e => e.key === 'Enter' && handleFeedback());

        function stem(word) {
            if (!word) return "";
            let w = word.toLowerCase().trim();
            // Force American Spelling
            if (britishToAmerican[w]) w = britishToAmerican[w];
            // Basic Stemming
            return w.replace(/(ing|ed|es|s|ly|ment)$/, '');
        }

        function handleAddEntry() {
            const w = document.getElementById('wordInput').value;
            const r = document.getElementById('rankInput').value;
            if (w && r) {
                addEntry(w, r);
                document.getElementById('wordInput').value = '';
                document.getElementById('rankInput').value = '';
                document.getElementById('wordInput').focus();
            }
        }

        function addEntry(word, rank) {
            const clean = word.trim().toLowerCase();
            const r = parseInt(rank);
            if (!clean || isNaN(r)) return;

            // Prevent duplicates based on stem
            const s = stem(clean);
            if (entries.some(e => stem(e.word) === s)) return;

            entries.push({ word: clean, rank: r });
            renderUI();
            processLogic();
        }

        function handleFeedback() {
            const r = document.getElementById('feedbackRank').value;
            if (r && currentPrediction) {
                addEntry(currentPrediction, r);
                document.getElementById('feedbackRank').value = '';
            }
        }

        function discardGuess() {
            if (currentPrediction) {
                addEntry(currentPrediction, 99999);
            }
        }

        async function processLogic() {
            if (entries.length === 0) return;
            
            const overlay = document.getElementById('loadingOverlay');
            overlay.classList.remove('hidden');

            try {
                // Multi-Threaded simulation via Promise.all
                const datasets = await Promise.all(entries.map(async (entry) => {
                    const clean = stem(entry.word);
                    // Fetch broad meanings, synonyms, and "triggers" (related context)
                    const [ml, trg] = await Promise.all([
                        fetch(`https://api.datamuse.com/words?ml=${clean}&max=400`).then(r => r.json()),
                        fetch(`https://api.datamuse.com/words?rel_trg=${clean}&max=100`).then(r => r.json())
                    ]);
                    return { rank: entry.rank, words: [...ml, ...trg] };
                }));

                const scores = new Map();
                const entryStems = entries.map(e => stem(e.word));
                const categories = new Map();

                datasets.forEach(({ rank, words }) => {
                    const weight = Math.pow(10, 6) / (rank + 1);
                    
                    words.forEach((item, i) => {
                        const w = item.word.toLowerCase();
                        const s = stem(w);
                        
                        // US-English Conversion on results
                        const finalWord = britishToAmerican[w] || w;

                        if (entryStems.includes(s)) return;

                        if (!scores.has(s)) {
                            scores.set(s, { word: finalWord, val: 0, hits: 0, types: new Set() });
                        }
                        
                        const meta = scores.get(s);
                        meta.val += (item.score / (i + 1)) * weight;
                        meta.hits += 1;
                        
                        // Extract "tags" if available to identify categories (n = noun, v = verb, etc)
                        if (item.tags) item.tags.forEach(t => meta.types.add(t));
                    });
                });

                // Calculate most likely category
                const typeCounters = { 'n': 0, 'v': 0, 'adj': 0 };
                scores.forEach(m => m.types.forEach(t => typeCounters[t]++));
                updateCategories(typeCounters);

                // Rank final candidates
                const winner = Array.from(scores.values())
                    .sort((a, b) => (b.val * Math.pow(b.hits, 4)) - (a.val * Math.pow(a.hits, 4)))[0];

                if (winner) {
                    currentPrediction = winner.word;
                    document.getElementById('topGuess').innerText = currentPrediction;
                    document.getElementById('predictionDisplay').classList.remove('hidden');
                }

            } finally {
                overlay.classList.add('hidden');
            }
        }

        function updateCategories(counts) {
            const box = document.getElementById('categoryBox');
            const list = document.getElementById('categoryList');
            box.classList.remove('hidden');
            list.innerHTML = '';
            
            const mapping = { 'n': 'Objects/Items', 'v': 'Actions/Verbs', 'adj': 'Descriptions' };
            Object.entries(counts).sort((a,b) => b[1] - a[1]).forEach(([k, v]) => {
                if (v > 5 && mapping[k]) {
                    const div = document.createElement('div');
                    div.className = `category-pill px-4 py-1.5 rounded-full text-[10px] font-bold border border-zinc-800 ${v > 50 ? 'active-category' : 'text-zinc-500'}`;
                    div.innerText = mapping[k];
                    list.appendChild(div);
                }
            });
        }

        function renderUI() {
            const container = document.getElementById('hintContainer');
            container.innerHTML = entries.map((e, i) => `
                <div class="bg-zinc-900/80 border border-zinc-800 px-4 py-2 rounded-2xl flex items-center gap-3">
                    <span class="text-[10px] font-black uppercase tracking-widest text-zinc-300">${e.word}</span>
                    <span class="mono text-emerald-500 font-bold text-xs">#${e.rank}</span>
                    <button onclick="removeEntry(${i})" class="text-zinc-600 hover:text-white font-bold">×</button>
                </div>
            `).join('');
        }

        function removeEntry(i) {
            entries.splice(i, 1);
            renderUI();
            if (entries.length > 0) processLogic();
            else {
                document.getElementById('predictionDisplay').classList.add('hidden');
                document.getElementById('categoryBox').classList.add('hidden');
            }
        }

        function reset() {
            entries = [];
            currentPrediction = "";
            renderUI();
            document.getElementById('predictionDisplay').classList.add('hidden');
            document.getElementById('categoryBox').classList.add('hidden');
            document.getElementById('wordInput').focus();
        }
    </script>
</body>
</html>
